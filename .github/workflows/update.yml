name: Обновление данных и публикация Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # Manual runs on feature branches must never publish to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Lock the WHOLE read -> parse -> upload -> deploy transaction. Do not
    # cancel deployments that may already have been accepted by Pages.
    concurrency:
      group: football-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages source without changing settings
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$pages_mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Select Settings > Pages > Build and deployment > Source > GitHub Actions, then run this workflow on main. Existing site left unchanged."
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.enabled == 'true'
        with:
          # Queued schedules and reruns always build the current source.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.source.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
        if: steps.source.outputs.enabled == 'true'
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.enabled == 'true'
        id: pages
        with:
          enablement: false
      - name: Restore, refresh and validate football data; stage the site
        if: steps.source.outputs.enabled == 'true'
        run: python scripts/build_pages.py --site-url "$PAGES_URL" --output _site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.enabled == 'true'
        with:
          path: _site
      # Stored before deploy; restoration only accepts successful runs.
      # This checkpoint also protects against lagging Pages CDN responses.
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.enabled == 'true'
        with:
          name: football-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/data.json
            _state/player_stats_cache_2026.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish Pages artifact
        if: steps.source.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
