name: Обновление данных и публикация Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_cfu:
        description: "Однократно проверить КФС вне окон игрового дня"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

# Hold the lock from baseline recovery through publication. Feature-branch
# dispatches get their own group so they cannot replace a queued main run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'football-pages-production' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    # Manual runs on feature branches must never publish to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.source.outputs.enabled }}
      pages_artifact_name: ${{ steps.pages_metadata.outputs.name }}
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - name: Check Pages source without changing settings
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$pages_mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Select Settings > Pages > Build and deployment > Source > GitHub Actions, then run this workflow on main. Existing site left unchanged."
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.enabled == 'true'
        with:
          # Queued schedules and reruns always build the current source.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.source.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
        if: steps.source.outputs.enabled == 'true'
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.enabled == 'true'
        id: pages
        with:
          enablement: false
      - name: Restore, refresh and validate football data; stage the site
        if: steps.source.outputs.enabled == 'true'
        run: python scripts/build_pages.py --site-url "$PAGES_URL" --output _site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CFU_FORCE: ${{ inputs.force_cfu || false }}
      - name: Name this Pages upload
        id: pages_metadata
        if: steps.source.outputs.enabled == 'true'
        run: printf 'name=github-pages-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      # v3 preserves the staged .nojekyll file.
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        if: steps.source.outputs.enabled == 'true'
        with:
          name: ${{ steps.pages_metadata.outputs.name }}
          path: _site
      # Stored before deploy; restoration only accepts successful runs.
      # This checkpoint also protects against lagging Pages CDN responses.
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.enabled == 'true'
        with:
          name: football-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/data.json
            _site/cfu-sync-2026.json
            _state/player_stats_cache_2026.json
          retention-days: 90
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /scripts/wait_for_pages_artifact.py
          sparse-checkout-cone-mode: false
      # A deploy-only rerun reads the successful build's outputs from the
      # earlier attempt, even though GITHUB_RUN_ATTEMPT has since changed.
      - name: Wait for Pages artifact visibility
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.pages_artifact_name }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: python3 scripts/wait_for_pages_artifact.py
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
