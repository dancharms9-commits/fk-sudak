name: Обновление данных
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "fetch_data.py"
      - "update_player_stats.py"
      - "data.json"
      - "sw.js"
      - "manifest.json"
      - "modern-home.css"
      - "match-center.css"
      - "apply_visual_refresh.py"
      - "fk-sudak-pwa-*.png"
      - "icon-*.png"
      - "assets/players/**"
      - "docs/player-photo-permissions.json"
      - "tests/**"
      - ".github/workflows/update.yml"
permissions: {contents: read}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save --package-lock=false playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.test.cjs
      - run: node tests/browser.cjs
      - run: node tests/player-photos.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: player-photo-screenshots
      - run: node tests/home-dashboard.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: dashboard-screenshots
      - run: node tests/match-center.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: match-center-screenshots
      - run: node tests/tab-transitions.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: tab-screenshots
      - run: node tests/tab-reload.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: reload-frames
      - run: node tests/launch-splash.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: launch-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshots
          path: |
            player-photo-screenshots/
            launch-screenshots/
            dashboard-screenshots/
            match-center-screenshots/
            tab-screenshots/
            reload-frames/
          if-no-files-found: ignore
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      # Протоколы входят в data.json. Недоступность отдельного протокола
      # не блокирует почасовое обновление остальных разделов.
      - run: python fetch_data.py
      # Дополнительная статистика факультативна. Ошибка здесь не должна
      # блокировать сохранение рабочих календаря, таблицы и новостей.
      - run: python update_player_stats.py || echo "Статистика игроков временно недоступна"
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          if [ -f player_stats_cache_2026.json ]; then git add player_stats_cache_2026.json; fi
          git diff --cached --quiet || (git commit -m "Обновление данных" && git push)
