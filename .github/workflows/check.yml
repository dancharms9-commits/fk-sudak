name: Проверки приложения
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "index.html"
      - "fetch_data.py"
      - "update_player_stats.py"
      - "data.json"
      - "sw.js"
      - "manifest.json"
      - "modern-home.css"
      - "match-center.css"
      - "championship.css"
      - "apply_visual_refresh.py"
      - "fk-sudak-pwa-*.png"
      - "icon-*.png"
      - "assets/players/**"
      - "assets/clubs/**"
      - "docs/player-photo-permissions.json"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 pyyaml
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save --package-lock=false playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.test.cjs
      - run: node tests/browser.cjs
      - name: Prepare base HTML for visual comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:index.html" > "$RUNNER_TEMP/multi-club-base.html"
          echo "MULTI_CLUB_BASELINE_HTML=$RUNNER_TEMP/multi-club-base.html" >> "$GITHUB_ENV"
          git show "$BASE_SHA:data.json" > "$RUNNER_TEMP/roster-base-data.json"
          echo "ROSTER_BASELINE_DATA=$RUNNER_TEMP/roster-base-data.json" >> "$GITHUB_ENV"
      - run: node tests/multi-club.browser.cjs
      - run: node tests/design-polish.browser.cjs
        env:
          DESIGN_SCREENSHOT_DIR: design-polish-screenshots
      - run: node tests/design-preservation.browser.cjs
        env:
          DESIGN_PRESERVATION_DIR: design-preservation-screenshots
      - run: node tests/club-pages.browser.cjs
        env:
          CLUB_SCREENSHOT_DIR: club-screenshots
      - run: node tests/roster-profiles.browser.cjs
        env:
          ROSTER_SCREENSHOT_DIR: roster-screenshots
      - run: node tests/championship.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: championship-screenshots
      - run: node tests/player-photos.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: player-photo-screenshots
      - run: node tests/home-dashboard.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: dashboard-screenshots
      - run: node tests/match-center.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: match-center-screenshots
      - run: node tests/universal-matches.browser.cjs
        env:
          MATCH_SCREENSHOT_DIR: ${{ runner.temp }}/universal-match-screenshots
      - run: node tests/tab-transitions.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: tab-screenshots
      - run: node tests/tab-reload.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: reload-frames
      - run: node tests/launch-splash.browser.cjs
        env:
          VISUAL_SCREENSHOT_DIR: launch-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshots
          path: |
            design-polish-screenshots/
            design-preservation-screenshots/
            ${{ runner.temp }}/universal-match-screenshots/
            roster-screenshots/
            club-screenshots/
            championship-screenshots/
            player-photo-screenshots/
            launch-screenshots/
            dashboard-screenshots/
            match-center-screenshots/
            tab-screenshots/
            reload-frames/
          if-no-files-found: ignore
      - name: Package the site snapshot for review (no deployment)
        run: |
          python - <<'PYTHON'
          from scripts.build_pages import ROOT, decode_json, stage_site
          stage_site(ROOT, ROOT / "_site", decode_json((ROOT / "data.json").read_bytes()))
          PYTHON
      - run: node tests/pages-pwa.browser.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
