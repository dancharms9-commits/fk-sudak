name: Official roster data review (no deployment)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'rffk-data-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Prepare bounded official data artifact for review
        run: python -m scripts.multi_club_rosters --output roster-review/data.json --report roster-review/report.json --max-profiles 600 --seconds 900 --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-roster-review
          path: roster-review/
          if-no-files-found: error
