<script data-theme-policy>
// Resolve the existing data-theme attribute before any application styles paint.
(()=>{
  let theme='dark';
  try{const saved=localStorage.getItem('sudak-theme');if(saved==='light'||saved==='dark')theme=saved}catch{}
  document.documentElement.dataset.theme=theme;
})();
</script>
<style id="launch-canvas">html{background:#001329}</style>
<script data-launch-policy>
// A new document navigation is the observable launch boundary, not a storage TTL.
// Restored PWA tasks may be reported as reload/back_forward: prefer no replay.
(()=>{
  const navigation=performance.getEntriesByType?.('navigation')[0];
  const type=navigation?.type??({0:'navigate',1:'reload',2:'back_forward'})[performance.navigation?.type];
  document.documentElement.dataset.launch=type==='navigate'?'show':'skip';
  if(type!=='navigate')document.getElementById('launch-canvas').remove();
})();
</script>

  <img class="launch-crest" src="assets/club-crest-final-original.png" alt="" width="1086" height="1448" fetchpriority="high" decoding="async">

<div id="launch-error" role="alert" hidden>
  <p>Не удалось завершить запуск. Можно продолжить с доступной информацией или повторить загрузку.</p>
  <button type="button" id="launch-continue">Продолжить</button>
  <button type="button" id="launch-retry">Повторить загрузку</button>
</div>
<script data-launch-splash>
// One controller per document: hash routes, data refresh and focus never restart it.
(()=>{
  const splash=document.getElementById('launch-splash');
  if(document.documentElement.dataset.launch!=='show'){
    splash.remove();return;
  }
  const image=splash.querySelector('img');
  const warning=document.getElementById('launch-error');
  const timers=[];
  const locked=[];
  let finished=false,appReady=false,crestReady=false,started=false;
  let previousFocus=null;
  splash.hidden=false;
  function finish(failed=false){
    if(finished)return;
    finished=true;
    timers.forEach(clearTimeout);
    locked.forEach(([element,inert])=>{element.inert=inert});
    splash.remove();
    document.getElementById('launch-canvas')?.remove();
    warning.hidden=!failed;
    window.removeEventListener('error',onError);
    window.removeEventListener('unhandledrejection',onError);
    window.removeEventListener('sudak:ready',onReady);
    window.removeEventListener('pagehide',onPageHide);
    if(previousFocus?.isConnected&&!failed)previousFocus.focus({preventScroll:true});
  }
  function start(){
    if(started||finished||!appReady||!crestReady)return;
    started=true;
    // Count the brand interval only once the actual approved PNG is visible.
    timers.push(setTimeout(()=>splash.classList.add('is-leaving'),3000));
    timers.push(setTimeout(()=>finish(),3500));
  }
  function onReady(){
    if(finished||appReady)return;
    appReady=true;
    previousFocus=document.activeElement===document.body?null:document.activeElement;
    document.querySelectorAll('body > header,body > main,body > nav').forEach(element=>{
      locked.push([element,element.inert]);element.inert=true;
    });
    start();
  }
  function onError(){finish(true)}
  function onPageHide(){finish()}
  // A BFCache restoration must not resume a partly completed launch overlay.
  window.addEventListener('pagehide',onPageHide);
  window.addEventListener('sudak:ready',onReady);
  window.addEventListener('error',onError);
  window.addEventListener('unhandledrejection',onError);
  image.addEventListener('load',()=>{
    crestReady=true;splash.classList.add('crest-ready');start();
  },{once:true});
  image.addEventListener('error',onError,{once:true});
  if(image.complete){
    if(image.naturalWidth){crestReady=true;splash.classList.add('crest-ready')}
    else onError();
  }
  // A broken script, unavailable image or stalled startup must never trap users.
  timers.push(setTimeout(()=>finish(true),8000));
  document.getElementById('launch-continue').addEventListener('click',()=>{warning.hidden=true});
  document.getElementById('launch-retry').addEventListener('click',()=>location.reload());
})();
</script>

let tabTransition=null;

function prepareTabTransition(next){
  clearTabTransition();
  const previous=document.querySelector('main section.on');
  const tabs=['home','matches','table','squad','news'];
  if(document.readyState==='loading'||!previous||previous===next||!tabs.includes(previous.id)||!tabs.includes(next.id)||
    $('launch-splash')||!next.animate||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return ()=>{};
  // Cancel section entry effects so they cannot compete with the crossfade.
  for(const element of [previous,next])element.getAnimations().forEach(animation=>animation.cancel());
  const rect=previous.getBoundingClientRect();
  const top=Math.max(0,document.querySelector('main').getBoundingClientRect().top);
  const bottom=$('nav').getBoundingClientRect().top;
  const properties={'--tab-left':rect.left+'px','--tab-top':rect.top+'px','--tab-width':rect.width+'px',
    '--tab-clip-top':Math.max(0,top-rect.top)+'px','--tab-clip-bottom':Math.max(0,rect.bottom-bottom)+'px'};

    previous.inert=inert;

    if(tabTransition===clear)tabTransition=null;
  };
  tabTransition=clear;
  return ()=>{
    if(next.id==='home')homeOpened=true;
    const options={duration:200,easing:'cubic-bezier(.2,.65,.3,1)'};
    animations=[previous.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-6px)'}],options),
      next.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],options)];

// Данные федерации обновляются в GitHub каждый час. Открытая вкладка
// проверяет опубликованный data.json каждые пять минут, а также при
// возвращении на вкладку и восстановлении подключения к интернету.
// Перерисовываем карточки только при появлении новой версии данных.
const DATA_POLL_MS=5*60*1000;
const DATA_MIN_GAP_MS=15*1000;
let lastAttemptAt=0;
let lastDataTimestamp=-Infinity;
let lastDataLabel="";
let hasNetworkData=false;
let hasSavedData=false;
const DATA_STORAGE_KEY="sudak-data-v1";
let loadingData=false;

function dataLabel(timestamp){
  return "Данные обновлены: "+new Date(timestamp).toLocaleString("ru-RU",{
    day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

function validData(d){
  return d&&Array.isArray(d.table)&&d.table.length>=5&&
    d.table.some(row=>Array.isArray(row)&&String(row[0]).includes("Судак"))&&
    Array.isArray(d.res)&&Array.isArray(d.next)&&Array.isArray(d.news)&&
    d.squad&&typeof d.squad==="object"&&!Array.isArray(d.squad)&&Number.isFinite(Date.parse(d.updated));
}
function adoptData(d){
  const platform=clubPlatform(d.platform);if(platform)PLATFORM=platform;
  TABLE=d.table;RES=d.res;NEXT=d.next;SQUAD=d.squad;
  NEWS=d.news;COACH=typeof d.coach==="string"?d.coach:COACH;
  CHAMPIONSHIP=d.championship?.season===2026?d.championship:null;
  PLAYER_STATS_2026=d.player_stats_2026||null;
  MATCH_DETAILS=d.match_details&&typeof d.match_details==="object"&&!Array.isArray(d.match_details)?d.match_details:{};
}
function restoreSavedData(){
  try{
    const d=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY));
    if(!validData(d))return;
    adoptData(d);lastDataTimestamp=Date.parse(d.updated);
    lastDataLabel=dataLabel(lastDataTimestamp);hasSavedData=true;
    $("upd").textContent=lastDataLabel+" · Сохранённые данные; проверяем обновления…";
  }catch{/* Storage may be disabled or full; network loading still works. */}
}

async function refreshData(force=false){
  if(loadingData||(!force&&Date.now()-lastAttemptAt<DATA_MIN_GAP_MS))return;
  lastAttemptAt=Date.now();
  loadingData=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    // Уникальный параметр запрещает промежуточным кэшам возвращать старую
    // версию; service worker исключает data.json из своего кэширования.
    const url=new URL("data.json",document.baseURI);
    url.searchParams.set("v",String(Date.now()));
    const response=await fetch(url.href,{
      cache:"no-store",signal:controller.signal,headers:{Accept:"application/json"}
    });
    if(!response.ok)throw Error("HTTP "+response.status);
    const d=await response.json();
    if(!validData(d))throw Error("Неожиданный формат данных");
    const stamp=Date.parse(d.updated);
    // Защита от запаздывающего ответа CDN: не откатываемся к старой версии.
    if(stamp>=lastDataTimestamp){
      if(!hasNetworkData||stamp>lastDataTimestamp){
        const scroll=window.scrollY,active=document.activeElement;
        const focusId=active?.id,selection=active?.selectionStart;
        adoptData(d);
        render();
        if(focusId){const el=$(focusId);el?.focus({preventScroll:true});if(el?.type==='search'&&selection!==null)el.setSelectionRange(selection,selection)}
        window.scrollTo(0,scroll);
      }
      lastDataTimestamp=stamp;
      lastDataLabel=dataLabel(stamp);
      try{localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify(d));hasSavedData=true}catch{}
    }
    hasNetworkData=true;
    $("upd").textContent=lastDataLabel;
    $("retry-data").hidden=true;
  }catch(error){
    // При отсутствии сети не очищаем уже показанный календарь и результаты.
    $("upd").textContent=hasNetworkData||hasSavedData
      ?lastDataLabel+" · Нет связи, показаны последние полученные данные"
      :"Нет свежих данных: показана резервная информация. Проверьте интернет.";
    $("retry-data").hidden=false;
  }finally{
    clearTimeout(timeout);
    loadingData=false;
  }
}

// One player identity, explicit club/season context; never combine club totals.
function platformPlayerHref(id,teamId){
  return '#player='+encodeURIComponent('rffk-'+id)+(teamId?'&team='+encodeURIComponent(teamId)+'&competition=4&season=22&from=team':'');
}
function platformMembership(id,teamId){
  const r=PLATFORM?.rosters?.['4:22:'+teamId];
  if(!r)return null;
  const regs=Object.values(PLATFORM.registrations||{}).filter(reg=>reg.playerId===id&&reg.teamId===teamId&&reg.roleKind!=='staff');
  if(!r.playerIds?.includes(id)&&!r.clubPlayerIds?.includes(id)&&!regs.length)return null;
  const stored=r.entriesByPlayerId?.[id],entry=stored?.currentlyListed===false?null:stored,seasonRegs=regs.filter(reg=>reg.scope==='competition_season'&&reg.competitionId==='4'&&reg.seasonId==='22'),positions=[...new Set(seasonRegs.map(reg=>reg.position).filter(Boolean))],numbers=[...new Set(seasonRegs.map(reg=>reg.number).filter(n=>Number.isInteger(n)))];
  return {teamId,position:entry?.position||(positions.length===1?positions[0]:null),
    number:entry?.number??(numbers.length===1?numbers[0]:null),registrations:regs,
    state:teamId==='141'&&r.playerIds?.includes(id)&&r.quality?.reason==='imported_snapshot'?'legacy':r.playerIds?.includes(id)?'confirmed':r.historicalPlayerIds?.includes(id)||(regs.some(reg=>reg.scope==='club')&&regs.filter(reg=>reg.scope==='club').every(reg=>reg.releasedAt&&reg.releasedAt<'2026-01-01'))?'historical':'unverified'};
}
function platformProfile(route){
  const id=/^rffk-([1-9]\d*)$/.exec(route.player||'')?.[1],person=PLATFORM?.playersById?.[id];
  if(!id||!person||person.playerId!==id)return null;
  const team=route.teamId?platformTeam(route.teamId):null;
  if(route.teamId&&(!team||route.competitionId!=='4'||route.seasonId!=='22'))return null;
  const membership=team?platformMembership(id,team.teamId):null;
  if(team&&!membership)return null;
  const stat=team?PLATFORM.playerSeasonStats?.[`${id}:${team.teamId}:4:22`]:null;
  const s=stat&&clubKnown(stat.quality)?stat:null;
  return {name:person.name,profile_url:person.sourceUrl,photo_url:person.photoUrl||null,photo_source_url:person.photoSourceUrl||null,
    position:membership?.position||'Амплуа не указано',number:membership?.number??null,
    league_games:s?.games??null,league_goals:s?.goals??null,league_minutes:s?.minutes??null,
    league_starts:s?.starts??null,league_substitutions:s?.substitutions??null,league_penalty_goals:s?.penaltyGoals??null,
    league_yellow_cards:s?.yellowCards??null,league_second_yellow_cards:s?.secondYellowCards??null,league_red_cards:s?.redCards??null,
    _platform:{id,teamId:team?.teamId||null,team,membership,stat:s,person}};
}
function platformProfileInfo(p){
  const c=p._platform;if(!c)return '';
  const labels={legacy:'Сохранённый состав «Судака». Регистрация сезона новым импортёром не проверялась.',confirmed:'Участие в чемпионате 2026 подтверждено.',historical:'Историческая связь с клубом. Участие в чемпионате 2026 не подтверждено.',unverified:'Клубная связь РФФК. Принадлежность к сезону 2026 пока не подтверждена.'};

}
function platformRosterHTML(teamId){
  const r=PLATFORM?.rosters?.['4:22:'+teamId];if(!r)return '';
  const list=(ids,state)=>{
    const players=ids.map(id=>PLATFORM.playersById[id]).filter(Boolean);
    const roles=[['Вратарь','Вратари'],['Защитник','Защитники'],['Полузащитник','Полузащитники'],['Нападающий','Нападающие'],[null,'Амплуа не указано']];
    return roles.map(([role,label])=>{
      const members=players.filter(p=>{const pos=platformMembership(p.playerId,teamId)?.position;return role?pos===role:!roles.some(([known])=>known&&known===pos)}).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
      return members.length?`<h3 class="club-roster-role">${label}</h3><ul class="club-players">${members.map(p=>{const m=platformMembership(p.playerId,teamId);return `<li><a class="club-roster-player" data-platform-player="${esc(p.playerId+':'+teamId)}" href="${esc(platformPlayerHref(p.playerId,teamId))}">${Number.isInteger(m?.number)?`<span class="club-shirt">${m.number}</span>`:''}<span>${esc(p.name)}${!role&&m?.position?`<small>${esc(m.position)}</small>`:''}</span><span aria-hidden="true">›</span></a></li>`}).join('')}</ul>`:'';
    }).join('');
  };
  const confirmed=r.playerIds||[],historical=r.historicalPlayerIds||[],unverified=r.unverifiedPlayerIds||[];
  const hasCatalog=Array.isArray(r.clubPlayerIds);
  return `${confirmed.length?`<h3>Чемпионат 2026 · подтверждено участие: ${confirmed.length}</h3>${list(confirmed,'confirmed')}`:hasCatalog?'<p class="empty">Сезонный состав пока не подтверждён. Общий клубный список показан отдельно.</p>':''}${unverified.length?`<details class="club-roster-extra"><summary>Общий список РФФК · сезон не подтверждён: ${unverified.length}</summary><p class="hint">Наличие на клубной странице не доказывает регистрацию в чемпионате 2026.</p>${list(unverified,'unverified')}</details>`:''}${historical.length?`<details class="club-roster-extra"><summary>Исторические регистрации: ${historical.length}</summary>${list(historical,'historical')}</details>`:''}${hasCatalog?clubQuality(r.clubListQuality,!r.clubPlayerIds.length):clubQuality(r.quality,!confirmed.length)}`;
}

// Platform v1 selectors: only pinned season participants and ID joins.
let PLATFORM=null;
const CLUB_IDS=Object.freeze(['141','936','1030','932','521','930','146','934','757','1028','117']);
function clubPlatform(p){
  const s=p?.competitionSeasons?.['4:22'],ids=s?.participantTeamIds;
  return p?.schemaVersion===1&&p.provider==='rffk'&&s?.competitionId==='4'&&s.seasonId==='22'&&s.seasonYear===2026&&
    ['teamsById','matchesById','standings','rosters','playersById','playerSeasonStats','legacyLinks'].every(key=>p[key]&&typeof p[key]==='object'&&!Array.isArray(p[key]))&&
    (!p.standings['4:22']||Array.isArray(p.standings['4:22'].rows))&&Array.isArray(ids)&&ids.length===11&&new Set(ids).size===11&&CLUB_IDS.every(id=>ids.includes(id)&&p.teamsById?.[id]?.teamId===id&&typeof p.teamsById[id].name==='string')?p:null;
}
function platformTeam(id,p=PLATFORM){return typeof id==='string'&&CLUB_IDS.includes(id)&&p?.competitionSeasons?.['4:22']?.participantTeamIds?.includes(id)?p.teamsById?.[id]||null:null}
const clubHref=id=>'#team='+encodeURIComponent(id);
function clubOfficialURL(raw,kind,id){
  try{const u=new URL(raw);return u.protocol==='https:'&&u.host==='rffk-roo.ru'&&u.pathname===`/${kind}/${id}/`&&!u.search&&!u.hash?u.href:''}catch{return ''}
}
function clubLogo(id){
  const t=platformTeam(id);if(!t)return '';
  if(id==='141')return 'icon-192.png?v=final-crest-v7';
  return /^https:\/\/rffk-roo\.ru\/uploads\/clubs\/small\/[\w.-]+\.png$/.test(t.branding?.officialLogoUrl||'')?'assets/clubs/'+id+'.png':'';
}
function clubBadge(id){
  const t=platformTeam(id),url=clubLogo(id);
  const initials=t?.name?.replace(/[«»"']/g,'').split(/\s+/).filter(w=>!['ФК','СК'].includes(w)).slice(0,2).map(w=>w[0]).join('')||'?';
  return `<span class="champ-badge" aria-hidden="true"><span>${esc(initials)}</span>${url?`<img src="${esc(url)}" alt="" width="32" height="32" loading="lazy">`:''}</span>`;
}
function clubLink(id,label,badge=false){
  const t=platformTeam(id),text=label??t?.name??'Команда не подтверждена';
  return t?`<a class="club-link" data-team="${esc(id)}" href="${clubHref(id)}">${badge?clubBadge(id):''}<span>${esc(text)}</span></a>`:esc(text);
}
const clubKnown=q=>['current','stale','temporarily_unavailable'].includes(q?.status);
function clubQuality(q,empty=false){
  const stamp=Number.isFinite(Date.parse(q?.lastVerifiedAt||''))?new Date(q.lastVerifiedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):'';
  const messages={current:'Подтверждённые данные РФФК.',stale:'Сохранённый снимок. Актуальность пока не подтверждена.',
    not_published:'Источник не публикует эти сведения.',temporarily_unavailable:'Источник временно недоступен.'+(empty?'':' Сохранены последние полученные данные.'),
    not_checked:'Данные пока не опубликованы в приложении. Загрузка этого раздела ещё не выполнена.'};
  return `<p class="hint">${messages[q?.status]||'Данные пока не опубликованы в приложении.'}${stamp?' Последнее подтверждение: '+esc(stamp)+' · МСК.':''}${q?.coverage==='partial'?' Данные неполные.':''}</p>`;
}
function clubContext(id,p=PLATFORM,now=Date.now()){
  const team=platformTeam(id,p);if(!team)return null;
  const inSeason=r=>r?.competitionId==='4'&&r.seasonId==='22';
  const table=p.standings?.['4:22'];
  const standing=inSeason(table)&&clubKnown(table.quality)?(Array.isArray(table.rows)?table.rows.find(r=>r?.teamId===id):null)||null:null;
  const matches=Object.values(p.matchesById||{}).filter(m=>inSeason(m)&&clubKnown(m.quality)&&
    platformTeam(m.homeTeamId,p)&&platformTeam(m.awayTeamId,p)&&m.homeTeamId!==m.awayTeamId&&[m.homeTeamId,m.awayTeamId].includes(id));
  const played=m=>['finished','technical'].includes(m.status)&&[m.homeScore,m.awayScore].every(n=>Number.isInteger(n)&&n>=0);
  const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
  const results=matches.filter(played).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.matchId.localeCompare(a.matchId)).slice(0,5);
  const upcoming=matches.filter(m=>m.status==='scheduled'&&/^2026-\d{2}-\d{2}$/.test(m.date||'')&&m.date>=day&&m.homeScore===null&&m.awayScore===null)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  const roster=p.rosters?.['4:22:'+id];
  const players=inSeason(roster)&&roster.teamId===id&&clubKnown(roster.quality)?(Array.isArray(roster.playerIds)?roster.playerIds:[]).map(pid=>p.playersById?.[pid]?.playerId===pid?p.playersById[pid]:null).filter(player=>player&&clubKnown(player.quality)):[];
  const stats=Object.values(p.playerSeasonStats||{}).filter(s=>inSeason(s)&&s.teamId===id&&clubKnown(s.quality)&&p.playersById?.[s.playerId]?.playerId===s.playerId);
  return {team,standing,tableQuality:table?.quality,results,upcoming,players,rosterQuality:roster?.quality,stats};
}

function renderClub(){
  const route=currentRoute();if(route.section!=='team')return;
  const model=clubContext(route.teamId),root=$('team');
  let html='<button type="button" class="match-back" id="team-back">← Назад</button>';

    html+='<h2 id="team-title" tabindex="-1">Команда недоступна</h2><p class="card empty">Команда не входит в подтверждённый список сезона либо данные платформы ещё не загружены. Выберите клуб в таблице чемпионата.</p><a class="club-source" href="#table">К чемпионату →</a>';
  }else{
    const {team,standing:s,results,upcoming,players,stats}=model;
    const metric=n=>Number.isInteger(n)?String(n):'—';
    const source=clubOfficialURL(team.sourceUrl,'teams',team.teamId);
    const metrics=s?`<dl class="club-metrics">${[['Место',s.rank],['Очки',s.points],['Матчи',s.played]].map(([label,n])=>`<div><dt>${label}</dt><dd>${metric(n)}</dd></div>`).join('')}</dl><div class="club-record">${[['Победы',s.wins],['Ничьи',s.draws],['Поражения',s.losses],['Забито',s.goalsFor],['Пропущено',s.goalsAgainst],['Разница',s.goalDifference]].map(([label,n])=>`<span>${label}: <b>${metric(n)}</b></span>`).join('')}</div>`:'<p class="empty">Положение в чемпионате пока не загружено.</p>';
    html+=`<div class="card club-hero">${clubBadge(team.teamId)}<div><h2 id="team-title" tabindex="-1">${esc(team.name)}</h2><p class="club-city">${esc(team.city||'Город пока не указан')}</p><p class="club-season">Открытый чемпионат Республики Крым · 2026</p></div></div><h2>В чемпионате</h2><div class="card">${metrics}${clubQuality(model.tableQuality,!s)}</div><h2>Последние результаты · до 5 матчей</h2>${results.length?results.map(clubMatchHTML).join(''):'<p class="card empty">Подтверждённые результаты пока не загружены.</p>'}${clubQuality(results[0]?.quality,!results.length)}<h2>Предстоящие матчи</h2>${upcoming.length?upcoming.map(clubMatchHTML).join(''):'<p class="card empty">Подтверждённых предстоящих матчей в приложении пока нет.</p>'}${upcoming.length?clubQuality(upcoming[0].quality):''}<h2>Состав</h2><div class="card">${platformRosterHTML(team.teamId)}</div><h2>Статистика футболистов</h2><div class="card">${stats.length?`<p class="hint">Доступные записи; полнота состава и показателей не гарантируется.</p><ul class="club-players">${stats.map(s=>`<li><a data-platform-player="${esc(s.playerId+':'+team.teamId)}" href="${esc(platformPlayerHref(s.playerId,team.teamId))}">${esc(PLATFORM.playersById[s.playerId].name)}</a><p class="club-player-stats">Матчи: ${metric(s.games)} · Голы: ${metric(s.goals)} · Минуты: ${metric(s.minutes)}</p>${clubQuality(s.quality)}</li>`).join('')}</ul>`:'<p class="empty">Данные пока не опубликованы в приложении. Полная статистика этого клуба ещё не загружена.</p>'}</div>${source?`<a class="club-source" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Официальная страница клуба · РФФК ↗</a>`:''}<h2>Команды чемпионата</h2><div class="card club-directory">${CLUB_IDS.map(id=>clubLink(id)).join('')}</div>`;
  }
  if(root._clubHTML!==html){root.innerHTML=html;root._clubHTML=html;for(const img of root.querySelectorAll?.('img')||[])img.addEventListener('error',()=>img.remove(),{once:true})}
  document.title=(model?model.team.name:'Команда')+' · ФК «Судак»';
}
function openClub(event){
  const link=event.target.closest('a[data-team]');if(!link||!plainClick(event)||!platformTeam(link.dataset.team))return;
  event.preventDefault();
  rememberPosition();history.replaceState({...history.state,focusTeam:link.dataset.team},'',location.href);
  history.pushState({teamEntry:true,parent:location.hash||'#home'},'',link.getAttribute('href'));applyRoute();
}
for(const id of ['table','match','team','player'])$(id).addEventListener('click',openClub);
$('team').addEventListener('click',event=>{
  if(event.target.closest('#team-back')){
    if(history.state?.teamEntry)history.back();else{history.replaceState({},'','#table');applyRoute()}
  }
  const link=event.target.closest('a[data-club-protocol]');if(!link||!plainClick(event))return;
  event.preventDefault();rememberPosition(link.dataset.match);history.pushState({matchEntry:true,parent:location.hash},'',link.getAttribute('href'));applyRoute();
});

// Championship uses the same data.json snapshot and existing club routes.
let CHAMPIONSHIP=null;
const CHAMP_STATE_KEY='sudak-championship-v1';
const CHAMP_VIEWS=['standings','calendar','scorers'];
function readChampState(){
  try{const s=JSON.parse(localStorage.getItem(CHAMP_STATE_KEY));return s&&typeof s==='object'?s:{}}catch{return {}}
}
const savedChampState=readChampState();
let CHAMP_STATE={view:CHAMP_VIEWS.includes(savedChampState.view)?savedChampState.view:'standings',
  round:typeof savedChampState.round==='string'?savedChampState.round:null,
  team:typeof savedChampState.team==='string'?savedChampState.team:'all',
  status:['all','played','upcoming'].includes(savedChampState.status)?savedChampState.status:'all',
  scorerTeam:typeof savedChampState.scorerTeam==='string'?savedChampState.scorerTeam:'all',
  search:typeof savedChampState.search==='string'?savedChampState.search.slice(0,150):''};
function saveChampState(){try{localStorage.setItem(CHAMP_STATE_KEY,JSON.stringify(CHAMP_STATE))}catch{}}
const champTeams=()=>CHAMPIONSHIP?.calendar?.teams||[];
const champRounds=()=>CHAMPIONSHIP?.calendar?.rounds||[];
const champMatches=()=>CHAMPIONSHIP?.calendar?.matches||[];
const champTeam=id=>champTeams().find(t=>t.id===id);
const champTeamName=id=>champTeam(id)?.name||'Название не опубликовано';
const champPlayed=m=>['finished','technical'].includes(m.status);
function defaultChampRound(rounds=champRounds(),matches=champMatches(),now=Date.now()){
  const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
  const future=matches.filter(m=>m.status==='scheduled'&&m.date&&m.date>=day).sort((a,b)=>a.date.localeCompare(b.date));
  if(future.length){
    const ids=new Set(future.filter(m=>m.date===future[0].date).map(m=>m.round_id));
    if(ids.size===1)return future[0].round_id;
  }
  return [...rounds].reverse().find(r=>matches.some(m=>m.round_id===r.id))?.id||rounds[0]?.id||null;
}
function selectedChampMatches(matches=champMatches(),state=CHAMP_STATE){
  return matches.filter(m=>m.round_id===state.round&&(state.team==='all'||[m.home_id,m.away_id].includes(state.team))&&
    (state.status==='all'||(state.status==='played'?champPlayed(m):!champPlayed(m)&&m.status!=='cancelled')));
}
function selectedChampScorers(players=CHAMPIONSHIP?.scorers?.players||[],state=CHAMP_STATE){
  const words=normalizedName(state.search).split(/\s+/).filter(Boolean);
  return players.filter(p=>(state.scorerTeam==='all'||p.team_id===state.scorerTeam)&&words.every(word=>normalizedName(p.name).includes(word)));
}
function championshipPlayer(p,players=playerRows()){
  if(p.team_id!=='141'||!p.id)return null;
  const candidates=players.filter(q=>playerKey(q)==='rffk-'+p.id&&normalizedName(q.name)===normalizedName(p.name));
  return candidates.length===1?candidates[0]:null;
}
function championshipClubMatch(m){
  if(!m.club_match_key||![m.home_id,m.away_id].includes('141'))return null;
  const d=MATCH_DETAILS[m.club_match_key];
  return d?.status==='available'&&String(d.id)===m.source_id&&d.date===m.date&&
    d.home_score===m.home_score&&d.away_score===m.away_score&&RES.some(r=>matchKey(r)===m.club_match_key)?m.club_match_key:null;
}
function champTeamOptions(selected){
  const teams=[...champTeams()].sort((a,b)=>(a.id==='141'?-1:b.id==='141'?1:(a.name||'я').localeCompare(b.name||'я','ru')));
  return '<option value="all">Все команды</option>'+teams.map(t=>`<option value="${esc(t.id)}" ${selected===t.id?'selected':''}>${esc(t.name||'Название не опубликовано · №'+t.id)}</option>`).join('');
}
function champBadge(id){
  const t=champTeam(id),url=t?.logo_url;
  let safe='';try{const u=new URL(url);if(u.protocol==='https:'&&u.host==='rffk-roo.ru'&&/^\/uploads\/clubs\/(small|medium|large)\/[\w.-]+$/.test(u.pathname)&&!u.search&&!u.hash)safe=u.href}catch{}
  const image=id==='141'?'icon-192.png?v=final-crest-v7':safe;
  return `<span class="champ-badge" aria-hidden="true"><span>${esc(t?.name?.replace(/[«»"']/g,'').split(/\s+/).filter(w=>!['ФК','СК'].includes(w)).slice(0,2).map(w=>w[0]).join('')||'?')}</span>${image?`<img src="${esc(image)}" alt="" width="32" height="32" loading="lazy" referrerpolicy="no-referrer">`:''}</span>`;
}
function champStatus(m){
  return m.status_label||m.statusLabel||({finished:'Матч завершён',technical:'Технический результат',scheduled:m.date?'Матч запланирован':'Дата уточняется',postponed:'Матч перенесён',cancelled:'Матч отменён',suspended:'Матч приостановлен'})[m.status]||'Статус уточняется';
}
function champDate(m){return (m.date?m.date.split('-').reverse().join('.'):'Дата не указана')+(m.time?' · '+m.time:'')}
function champMatchHTML(m){
  const score=Number.isInteger(m.home_score)&&Number.isInteger(m.away_score)?`${m.home_score}:${m.away_score}`:'—';
  const clubKey=championshipClubMatch(m),isClub=[m.home_id,m.away_id].includes('141');
  const card=`<span class="champ-meta">${esc(champDate(m))}</span><span class="champ-pair"><span class="champ-team">${platformTeam(m.home_id)?clubLink(m.home_id,champTeamName(m.home_id),true):champBadge(m.home_id)+'<b>'+esc(champTeamName(m.home_id))+'</b>'}</span><strong class="champ-score">${score}</strong><span class="champ-team">${platformTeam(m.away_id)?clubLink(m.away_id,champTeamName(m.away_id),true):champBadge(m.away_id)+'<b>'+esc(champTeamName(m.away_id))+'</b>'}</span></span><span class="champ-meta champ-status">${esc(champStatus(m))}<span aria-hidden="true"> ›</span></span>`;
  if(clubKey)return `<div class="card champ-match champ-club" data-champ-match="${esc(m.id)}">${card}<a class="club-source" data-match="${esc(clubKey)}" href="#match=${encodeURIComponent(clubKey)}&amp;from=table">Центр матча →</a></div>`;
  const confirmed=PLATFORM?.matchesById?.[m.id];
  if(confirmed)return `<div class="card champ-match ${isClub?'champ-club':''}" data-champ-match="${esc(m.id)}">${card}<a class="club-source" data-match="${esc(platformMatchKey(confirmed))}" href="#match=${encodeURIComponent(platformMatchKey(confirmed))}&amp;from=table">Центр матча →</a></div>`;
  const url=protocolLink(m.source_url);
  return `<details class="card champ-match ${isClub?'champ-club':''}" data-champ-match="${esc(m.id)}"><summary>${card}</summary><div class="champ-match-info"><p>${esc(champTeamName(m.home_id))} — ${esc(champTeamName(m.away_id))}</p><p>${esc(m.venue||'Стадион не указан')}</p><p class="hint">${champPlayed(m)?'Доступные сведения РФФК.':'Результат пока не опубликован.'}</p>${url?`<a class="champ-source" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Протокол РФФК ↗</a>`:'<p class="hint">Ссылка на протокол пока не опубликована.</p>'}</div></details>`;
}
function champScorerHTML(p){
  const local=championshipPlayer(p),url=officialPlayerURL(p.source_url),club=p.team_id==='141';
  const name=local?`<a href="${playerHref(local)}&amp;from=table" data-player="${esc(playerKey(local))}">${esc(p.name)}<span class="visually-hidden"> — профиль ФК «Судак»</span></a>`:url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(p.name)} <span aria-label="Официальная карточка РФФК">↗</span></a>`:esc(p.name);
  return `<li class="champ-scorer ${club?'champ-club':''}" data-scorer="${esc(p.id)}"><span class="champ-rank">${esc(p.rank)}</span><div class="champ-person"><b>${name}</b><small>${esc(p.team_name)}</small><small>Пенальти: ${statValue(p.penalty_goals)} · Минуты: ${statValue(p.minutes)}</small></div><span class="champ-total">${statValue(p.games)}<small>игр</small></span><span class="champ-total champ-goals">${statValue(p.goals)}<small>голов</small></span></li>`;
}
function champFreshness(section){
  const stamp=Number.isFinite(Date.parse(section?.updated||''))?new Date(section.updated).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):null;
  return `<p class="hint" role="status">${section?.stale?'Источник временно недоступен. Сохранены последние подтверждённые данные. ':''}${stamp?'Получено: '+esc(stamp)+' · МСК. ':''}<a href="https://rffk-roo.ru/tournaments/4/seasons/22/" target="_blank" rel="noopener noreferrer">Источник: РФФК ↗</a></p>`;
}
function clubStandingsHTML(){
  const table=PLATFORM?.standings?.['4:22'];
  if(table?.competitionId==='4'&&table.seasonId==='22'&&clubKnown(table.quality)&&Array.isArray(table.rows)&&table.rows.length)return table.rows.filter(r=>platformTeam(r?.teamId)).map(r=>`<tr class="${r.teamId==='141'?'me':''}"><td>${esc(r.rank)}</td><td>${clubLink(r.teamId,undefined,true)}</td><td>${esc(r.played??'—')}</td><td>${esc(r.goalsFor??'—')}–${esc(r.goalsAgainst??'—')}</td><td>${esc(r.points??'—')}</td></tr>`).join('');
  return TABLE.map((t,i)=>`<tr class="${String(t[0]).includes('Судак')?'me':''}"><td>${i+1}</td><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td><td>${esc(t[3])}</td></tr>`).join('');
}
function renderChampionship(){
  const root=$('table'),view=CHAMP_STATE.view;
  const open=[...(root.querySelectorAll?.('details[open][data-champ-match]')||[])].map(el=>el.dataset.champMatch);
  if(!champRounds().some(r=>r.id===CHAMP_STATE.round))CHAMP_STATE.round=defaultChampRound();
  const tabs=CHAMP_VIEWS.map((v,i)=>`<button type="button" id="champ-tab-${v}" role="tab" data-champ-view="${v}" aria-selected="${view===v}" aria-controls="champ-panel" tabindex="${view===v?0:-1}">${['Таблица','Туры и матчи','Бомбардиры'][i]}</button>`).join('');
  let content='';
  if(view==='standings'){
    content=`<div class="card champ-standing"><table><thead><tr><th scope="col">#</th><th scope="col">Команда</th><th scope="col">И</th><th scope="col">Мячи</th><th scope="col">О</th></tr></thead><tbody>${clubStandingsHTML()}</tbody></table></div><p class="hint">И — игры, О — очки. Официальная таблица РФФК; мячи указаны как забитые–пропущенные.</p>${PLATFORM?clubQuality(PLATFORM.standings?.['4:22']?.quality):''}`;
  }else if(view==='calendar'){
    const rounds=champRounds(),index=rounds.findIndex(r=>r.id===CHAMP_STATE.round),matches=selectedChampMatches();
    content=rounds.length?`<div class="champ-rounds"><button type="button" data-champ-step="-1" aria-label="Предыдущий тур" ${index<=0?'disabled':''}>← Назад</button><label class="visually-hidden" for="champ-round">Тур</label><select id="champ-round">${rounds.map(r=>`<option value="${esc(r.id)}" ${r.id===CHAMP_STATE.round?'selected':''}>${esc(r.name)}</option>`).join('')}</select><button type="button" data-champ-step="1" aria-label="Следующий тур" ${index===rounds.length-1?'disabled':''}>Вперёд →</button></div><div class="champ-filters"><label>Команда<select id="champ-team">${champTeamOptions(CHAMP_STATE.team)}</select></label><label>Матчи<select id="champ-status">${[['all','Все матчи'],['played','Сыгранные'],['upcoming','Предстоящие']].map(([v,label])=>`<option value="${v}" ${v===CHAMP_STATE.status?'selected':''}>${label}</option>`).join('')}</select></label></div><p class="hint" id="champ-match-count" aria-live="polite">${esc(rounds[index]?.name)} · Матчей: ${matches.length}</p><div class="champ-match-list">${matches.length?matches.map(champMatchHTML).join(''):'<p class="card empty">Матчей по выбранным фильтрам нет. Можно выбрать другой тур или команду.</p>'}</div>`:'<p class="card empty">Календарь пока не загружен. При подключении данные появятся автоматически.</p>';
    content+=champFreshness(CHAMPIONSHIP?.calendar);
  }else{
    const players=selectedChampScorers(),total=CHAMPIONSHIP?.scorers?.players?.length||0;
    content=`<div class="champ-filters"><label>Поиск по ФИО<input type="search" id="champ-search" placeholder="Фамилия или имя" maxlength="150" value="${esc(CHAMP_STATE.search)}" autocomplete="off"></label><label>Команда<select id="champ-scorer-team">${champTeamOptions(CHAMP_STATE.scorerTeam)}</select></label></div><p class="hint" id="champ-scorer-count" aria-live="polite">Найдено: ${players.length} из ${total} · Порядок и места РФФК</p><ol class="card champ-scorers" aria-label="Бомбардиры чемпионата">${players.length?players.map(champScorerHTML).join(''):'<li class="empty">Футболисты не найдены.</li>'}</ol><p class="hint">Весь опубликованный рейтинг РФФК: ${total} игроков. Отсутствие в списке не означает ноль голов. Пенальти входят в число голов.</p>${champFreshness(CHAMPIONSHIP?.scorers)}`;
  }
  if(view==='scorers'&&!CHAMPIONSHIP?.scorers?.players?.length)content='<p class="card empty">Рейтинг пока не загружен. При подключении данные появятся автоматически.</p>'+champFreshness(CHAMPIONSHIP?.scorers);
  root.innerHTML=`<h2 id="table-title" tabindex="-1">Чемпионат РК <span class="champ-season">2026</span></h2><div class="champ-tabs" role="tablist" aria-label="Разделы чемпионата">${tabs}</div><div id="champ-panel" role="tabpanel" aria-labelledby="champ-tab-${view}">${content}</div>`;
  for(const el of root.querySelectorAll?.('details[data-champ-match]')||[])el.open=open.includes(el.dataset.champMatch);
  for(const img of root.querySelectorAll?.('.champ-badge img')||[])img.addEventListener('error',()=>img.remove(),{once:true});
}
function updateChampControls(focusId){
  saveChampState();const y=window.scrollY;renderChampionship();
  if(focusId)$(focusId)?.focus({preventScroll:true});window.scrollTo(0,y);
}
$('table').addEventListener('click',event=>{
  const tab=event.target.closest('[data-champ-view]'),step=event.target.closest('[data-champ-step]');
  if(tab){CHAMP_STATE.view=tab.dataset.champView;updateChampControls('champ-tab-'+CHAMP_STATE.view)}
  if(step){const rounds=champRounds(),index=rounds.findIndex(r=>r.id===CHAMP_STATE.round),next=rounds[index+Number(step.dataset.champStep)];if(next){CHAMP_STATE.round=next.id;updateChampControls('champ-round')}}
});
$('table').addEventListener('keydown',event=>{
  const tab=event.target.closest('[data-champ-view]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const i=CHAMP_VIEWS.indexOf(CHAMP_STATE.view);
  CHAMP_STATE.view=CHAMP_VIEWS[event.key==='Home'?0:event.key==='End'?2:(i+(event.key==='ArrowRight'?1:2))%3];updateChampControls('champ-tab-'+CHAMP_STATE.view);
});
$('table').addEventListener('change',event=>{
  const fields={'champ-round':'round','champ-team':'team','champ-status':'status','champ-scorer-team':'scorerTeam'},field=fields[event.target.id];
  if(field){CHAMP_STATE[field]=event.target.value;updateChampControls(event.target.id)}
});
$('table').addEventListener('input',event=>{
  if(event.target.id!=='champ-search')return;
  CHAMP_STATE.search=event.target.value;saveChampState();
  // Keep the input node, focus, caret and mobile keyboard during typing.
  const players=selectedChampScorers(),list=$('table').querySelector('.champ-scorers');
  list.innerHTML=players.length?players.map(champScorerHTML).join(''):'<li class="empty">Футболисты не найдены.</li>';
  $('champ-scorer-count').textContent=`Найдено: ${players.length} из ${CHAMPIONSHIP?.scorers?.players?.length||0} · Порядок и места РФФК`;
});

restoreSavedData();
render();
applyRoute(true);
window.dispatchEvent(new Event("sudak:ready"));
// Главная появляется после настоящей заставки; при reload доступна сразу.
if($('launch-splash')){
  const homeObserver=new MutationObserver(()=>{if(!$('launch-splash')){homeObserver.disconnect();revealHome()}});
  homeObserver.observe(document.body,{childList:true});
}
refreshData();
$("retry-data").addEventListener("click",()=>refreshData(true));
setInterval(()=>{if(!document.hidden)refreshData()},DATA_POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshData()});
window.addEventListener("focus",()=>refreshData());
window.addEventListener("online",()=>refreshData(true));
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    // Проверяем наличие новой версии приложения при открытии и далее раз в час.
    reg.update().catch(()=>{});
    setInterval(()=>{if(!document.hidden)reg.update().catch(()=>{})},60*60*1000);
  }).catch(()=>{});
}
