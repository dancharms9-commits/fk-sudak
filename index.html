<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F2C45"><link rel="apple-touch-icon" href="icon-192.png"><title>ФК «Судак»</title>
<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#0F2C45;--mute:#5E7486;--line:#D9E3E8;--sea:#1B7A8C;--navy:#0F2C45;--sun:#E3A93B;--win:#1E8E5A;--loss:#C0453A;--onnavy:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1822;--card:#122734;--ink:#E6EEF2;--mute:#8FA6B5;--line:#1E3A4B;--sea:#4FB3C4;--navy:#0D2233;--win:#4CC38A;--loss:#E07A6E}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--navy);color:var(--onnavy);padding:18px 18px 16px;display:flex;gap:14px;align-items:center}
.crest{width:52px;height:52px;border-radius:50%;background:var(--sea);display:grid;place-items:center;font-weight:800;font-size:26px;border:3px solid var(--sun);flex:none}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{padding:14px;max-width:640px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font-size:15px;margin:22px 2px 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.next{background:var(--navy);color:var(--onnavy);border:0}
.next .vs{font-size:26px;font-weight:800;margin:6px 0 2px}
.next small{opacity:.75;display:block}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sun);color:#3a2800;font-weight:600}
.board{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 10px}
.num{font-variant-numeric:tabular-nums;font-size:54px;font-weight:800;line-height:1;background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;min-width:64px;text-align:center}
.num.us{background:var(--sea)}
.tm{flex:1;text-align:center;font-size:14px;font-weight:600}
.form{display:flex;gap:6px}
.dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.W{background:var(--win)}.D{background:var(--mute)}.L{background:var(--loss)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .l{min-width:0}.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:13px}
.sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:500;text-align:right;padding:6px 4px}td{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
tr.me td{background:color-mix(in srgb,var(--sun) 22%,transparent);font-weight:700}
.g{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.pl{display:contents}.pl span{padding:9px 0;border-top:1px solid var(--line)}.pl span:last-child{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.news a{display:block;color:inherit;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--line)}
.news a:last-child{border:0}.news small{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--sea);font-weight:700}
nav button:focus-visible{outline:2px solid var(--sea)}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 8px 0}
</style>
</head>
<body>
<header><div class="crest">С</div><div><h1>ФК «Судак»</h1><p>Открытый чемпионат Крыма · стадион «Юность»</p></div></header>
<main>
<section id="home" class="on"></section>
<section id="matches"></section>
<section id="table"></section>
<section id="squad"></section>
<section id="news"></section>
<p class="note" id="upd"></p>
</main>
<nav id="nav">
<button data-t="home" class="on"><i>⌂</i>Главная</button>
<button data-t="matches"><i>⚽</i>Матчи</button>
<button data-t="table"><i>≡</i>Таблица</button>
<button data-t="squad"><i>☺</i>Состав</button>
<button data-t="news"><i>✎</i>Новости</button>
</nav>
<script>
let TABLE=[["СК «Каштан»",16,"90–21",48],["ФК «Судак»",16,"63–30",40],["«СТО-Газель»",15,"68–30",33],["ФК «Фуна»",15,"54–42",24],["ФК «НКСТРОЙ-Керчь»",15,"36–45",17],["ФК «Саки»",15,"34–55",15],["АФК",15,"29–45",14],["ФК «Сталкер»",16,"39–83",14],["ФК «Турбо»",16,"30–64",13],["«Темп»",15,"29–59",12],["УОР",6,"20–18",6]];
let RES=[["25 октября","ФК «Саки»",3,2,"Авангард, Саки","в гостях"],["10 октября","«СТО-Газель»",4,2,"«Юность», Судак","дома"],["4 октября","ФК «Фуна»",3,2,"«Демерджи», Нижняя Кутузовка","в гостях"],["26 сентября","АФК",6,1,"«Юность», Судак","дома"],["12 сентября","ФК «НКСТРОЙ-Керчь»",4,0,"Керчь","в гостях"],["6 сентября","«Темп»",4,0,"","" ],["29 августа","ФК «Турбо»",7,3,"«Юность», Судак","дома"]];
let NEXT=[["дата уточняется","«КФУ»","Стадион «КФУ», Симферополь","в гостях"],["14 ноября","УОР","«Олимпиец», Краснолесье","в гостях"],["22 ноября","ФК «Сталкер»","Евпатория","в гостях"],["28 ноября","СК «Каштан»","«Колос», Судак","дома"],["дата уточняется","ФК «Палыч»","«Колос», Судак","дома"],["дата уточняется","ФК «Адалет»","«Колос», Судак","дома"]];
let SQUAD={"Вратари":["Ибраимов Эльдар|39","Мельник Андрей|5"],"Защитники":["Абидов Руслан|37","Козиянчук Олег|28","Храмов Олег|12","Кормилин Александр|7","Скворцов Олег|8","Мыкуляк Тарас|2"],"Полузащитники":["Сгинухин Александр|29","Османов Исмет|27","Мустафаев Арсен|28","Симончук Владимир|27","Донской Илья|22","Семенов Владимир|22","Чебышев Александр|22","Лебедев Владимир|21","Куртиев Арсен|20","Добровольский Владислав|18","Абильванов Осман|17","Глушков Никита|15","Монахов Антон|13","Смирнов Владислав|12","Бардин Вадим|11","Сарычев Дмитрий|11","Патокин Александр|10","Халилов Сулейман|10","Бредун Евгений|8","Горбачев Виталий|8","Хистов Артём|7","Одинцов Евгений|6","Демьяненко Артём|5","Майстренко Богдан|5","Шилов Богдан|5","Филатов Никита|3","Демидов Максим|0","Мустафаев Фатих|0","Петраш Андрей|0","Полнер Кирилл|0"],"Нападающие":["Гайдаш Андрей|12","Фароян Саак|12","Абильвапов Энвер|11"]};
let NEWS=[["30 октября","С Днём тренера!","Федерация поздравила всех тренеров Крыма."],["21 октября","Судейские назначения: 18-й тур","25 октября, 15:00, «Авангард», Саки: «Саки» — «Судак»."],["27 октября","2-й сбор команд на Первенстве Крыма среди девушек","Игры прошли на базе «Скиф» в Новопавловке."]];

let COACH="Монахов Антон";
const $=id=>document.getElementById(id);
const lt={W:"В",D:"Н",L:"П"};
const kind=r=>r[2]>r[3]?"W":r[2]==r[3]?"D":"L";
function render(){
const form=RES.slice(0,5).map(kind);
const L=RES[0],N=NEXT[0],me=TABLE.findIndex(t=>t[0].includes("Судак")),lead=TABLE[0],mt=TABLE[me]||[];
const home=N[3]=="дома";
$("home").innerHTML=(N?`<div class="card next"><span class="tag">Ближайший матч</span><div class="vs">${home?"«Судак» — "+N[1]:N[1]+" — «Судак»"}</div><small>${N[0]}</small><small>${N[2]}</small></div>`:"")+
(L?`<h2>Последний матч</h2><div class="card"><div class="board"><div class="tm">ФК «Судак»</div><div class="num us">${L[2]}</div><div class="num">${L[3]}</div><div class="tm">${L[1]}</div></div><small style="display:block;text-align:center;color:var(--mute)">${L[0]}${L[4]?" · "+L[4]:""}</small></div>`:"")+
`<h2>Форма: последние 5 игр</h2><div class="card"><div class="form">${form.map(f=>`<div class="dot ${f}">${lt[f]}</div>`).join("")}</div></div>
<h2>В таблице</h2><div class="card"><div class="row"><div class="l"><b>${me+1} место</b><small>${mt[1]} игр, мячи ${mt[2]}</small></div><div class="sc">${mt[3]} очков</div></div>${me>0?`<div class="row"><div class="l"><b>До лидера</b><small>${lead[0]}</small></div><div class="sc">${lead[3]-mt[3]} очк.</div></div>`:""}</div>`;
$("matches").innerHTML=`<h2>Календарь</h2><div class="card">${NEXT.map(n=>`<div class="row"><div class="l"><b>${n[1]}</b><small>${n[2]}</small></div><div style="text-align:right"><b style="font-weight:600">${n[0]}</b><small style="color:var(--mute);font-size:13px">${n[3]}</small></div></div>`).join("")}</div>
<h2>Результаты</h2><div class="card">${RES.map(r=>{const k=kind(r);return `<div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="dot ${k}">${lt[k]}</div><div class="l"><b>${r[1]}</b><small>${r[0]}${r[4]?" · "+r[4]:""}</small></div></div><div class="sc">${r[2]}:${r[3]}</div></div>`}).join("")}</div>`;
$("table").innerHTML=`<h2>Открытый чемпионат РК</h2><div class="card" style="padding:6px 10px"><table><tr><th>#</th><th>Команда</th><th>И</th><th>Мячи</th><th>О</th></tr>${TABLE.map((t,i)=>`<tr class="${i==me?"me":""}"><td>${i+1}</td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td></tr>`).join("")}</table></div>`;
$("squad").innerHTML=(COACH?`<div class="card" style="margin-top:14px"><b>Главный тренер</b><br>${COACH}</div>`:"")+Object.entries(SQUAD).map(([k,v])=>`<h2>${k}</h2><div class="card"><div class="g"><span style="color:var(--mute);font-size:13px">Игрок</span><span style="color:var(--mute);font-size:13px;text-align:right">Игр</span>${v.map(p=>{const [n,g]=p.split("|");return `<div class="pl"><span>${n}</span><span>${g}</span></div>`}).join("")}</div></div>`).join("");
$("news").innerHTML=`<h2>Новости федерации</h2><div class="card news">${NEWS.map(n=>`<a><b>${n[1]}</b><br><small>${n[0]}${n[2]?" · "+n[2]:""}</small></a>`).join("")}</div>`;
}
$("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.t).classList.add("on");scrollTo(0,0)});
render();
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  TABLE=d.table;RES=d.res;NEXT=d.next;SQUAD=d.squad;NEWS=d.news.length?d.news:NEWS;COACH=d.coach||COACH;render();
  const t=new Date(d.updated);$("upd").textContent="Данные обновлены: "+t.toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
}).catch(()=>{$("upd").textContent="Нет связи: показаны сохранённые данные."});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
