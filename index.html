<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2C45">

<link rel="icon" type="image/png" href="icon-192.png?v=crest-v4">
<title>ФК «Судак»</title>
<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#0F2C45;--mute:#5E7486;--line:#D9E3E8;--sea:#1B7A8C;--navy:#0F2C45;--sun:#E3A93B;--win:#1E8E5A;--loss:#C0453A;--onnavy:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1822;--card:#122734;--ink:#E6EEF2;--mute:#8FA6B5;--line:#1E3A4B;--sea:#4FB3C4;--navy:#0D2233;--win:#4CC38A;--loss:#E07A6E;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--navy);color:var(--onnavy);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;display:flex;gap:14px;align-items:center}
.crest{width:52px;height:52px;border-radius:50%;background:var(--sea);display:grid;place-items:center;font-weight:800;font-size:26px;border:3px solid var(--sun);flex:none}
header h1{margin:0;font-size:22px;letter-spacing:.2px}header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{padding:14px;max-width:640px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font-size:15px;margin:22px 2px 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.next{background:var(--navy);color:var(--onnavy);border:0}
.next .vs{font-size:24px;font-weight:800;margin:6px 0 2px;overflow-wrap:anywhere}
.next small{opacity:.82;display:block;margin-top:3px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sun);color:#3a2800;font-weight:600}
.board{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px}
.num{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;line-height:1;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;min-width:58px;text-align:center}.num.us{background:var(--sea)}
.tm{flex:1;text-align:center;font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.form{display:flex;gap:6px}.dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}.W{background:var(--win)}.D{background:var(--mute)}.L{background:var(--loss)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .l{min-width:0;flex:1}.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:13px;margin-top:3px}.sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:500;text-align:right;padding:6px 4px}td{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}th:nth-child(2),td:nth-child(2){text-align:left;width:100%;overflow-wrap:anywhere}tr.me td{background:color-mix(in srgb,var(--sun) 22%,transparent);font-weight:700}
.g{display:grid;grid-template-columns:1fr auto;gap:0 12px}.pl{display:contents}.pl span{padding:9px 0;border-top:1px solid var(--line)}.pl span:last-child{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.news a{display:block;color:inherit;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--line)}.news a:last-child{border:0}.news a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}.news small{display:block;color:var(--mute);margin-top:4px}.news .source{font-size:12px;color:var(--sea)}
/* Раздел статистики: отдельные карточки, видимые значения и фильтры. */
.stats-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin:10px 2px}
.stats-head strong{font-size:17px}.stats-source{font-size:12px;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.stats-filters{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 10px;scrollbar-width:thin}
.stats-filters button{font:inherit;font-size:13px;white-space:nowrap;padding:8px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.stats-filters button[aria-pressed="true"]{background:var(--sea);color:#fff;border-color:var(--sea);font-weight:700}
.stats-filters button:focus-visible,.player-link:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stats-list{display:grid;gap:9px}.stats-player{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats-name{font-size:15px;font-weight:700}.stats-role{font-size:12px;color:var(--mute);margin-top:2px}
.stats-values{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.stats-value{min-width:74px;flex:1;border-radius:9px;background:var(--bg);padding:7px 10px}
.stats-value b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.stats-value small{color:var(--mute);font-size:11px}
.stats-minor{font-size:12px;color:var(--mute);margin:9px 0 0}
.stats-top{font-size:13px;line-height:1.7;margin:6px 0 0;padding-left:22px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px;min-width:0}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--sea);font-weight:700}nav button:focus-visible{outline:2px solid var(--sea)}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 8px 0}.empty{color:var(--mute);font-size:14px}.hint{color:var(--mute);font-size:12px;line-height:1.45;margin:10px 2px}.venue{color:var(--mute)}
/* Match links retain the existing cards, colours and mobile spacing. */
a.match-link{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.match-link:focus-visible,.match-back:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
a.match-link:hover{background:var(--bg)}
.match-cue{display:block;color:var(--sea);font-size:12px;text-align:center;margin-top:9px}
.match-back{font:inherit;background:var(--card);color:var(--sea);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:9px 14px;cursor:pointer}
.match-meta{text-align:center;color:var(--mute);font-size:14px;line-height:1.7;margin:0}
#match .tm small{display:block;font-size:11px;font-weight:400;color:var(--mute);margin-top:4px}
.goal-timeline{list-style:none;padding:0;margin:0}
.goal-timeline li{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.goal-timeline li:last-child{border:0}
.goal-minute{color:var(--sea);font-weight:700;min-width:46px;font-variant-numeric:tabular-nums}
.goal-player{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.goal-player small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
@media(max-width:360px){#match .board{gap:6px}#match .num{font-size:36px;min-width:44px;padding:9px 8px}}
a.player-link{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.player-link:hover{border-color:var(--sea)}
.player-hero{display:flex;align-items:center;gap:16px;margin-top:16px}
.player-hero>div:last-child{min-width:0}.player-hero h2{color:var(--ink);font-size:22px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.player-hero .stats-role{margin:7px 0 10px;font-size:14px}
.player-avatar{position:relative;display:grid;place-items:center;width:88px;height:104px;flex:none;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,var(--navy),var(--sea));border:2px solid var(--sun);color:#fff;font-size:28px;font-weight:800}
.player-avatar img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}
.profile-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.profile-values .stats-value{min-width:0;margin:0;padding:10px 8px}
.player-goals a.player-goal{display:flex}
@media(max-width:360px){.player-avatar{width:70px;height:88px}.player-hero{gap:12px}.player-hero h2{font-size:20px}}

/* Modern Football Home 2026 — progressive visual refresh, no routing/data changes. */
:root{
  --bg:#EDF4F8; --card:#FFFFFF; --ink:#102A43; --mute:#61798A;
  --line:#DBE6ED; --sea:#147F9A; --navy:#0B2A4A; --sun:#F4BA4C;
}
/* History restores scroll synchronously; do not animate programmatic routing. */
html{scroll-behavior:auto}
body{
  background:radial-gradient(ellipse 560px 380px at 87% -6%,#DCEFF8 0,transparent 85%),var(--bg);
  -webkit-tap-highlight-color:transparent;
}
header{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:80px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;
  background:linear-gradient(120deg,#071E38 0%,#0B3557 65%,#145B80 100%);
  box-shadow:0 4px 20px #0A233527;
}
header:after{
  content:"";position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#E8413A,#F3BB4E 52%,#37B3CB);
}
header .crest{
  width:54px;height:54px;flex:0 0 54px;
  border:1px solid #FFFFFF3D;border-radius:14px;overflow:hidden;
  background:#0D3A6B;box-shadow:0 5px 15px #0005;
}
header .crest img{width:100%;height:100%;object-fit:contain;display:block}
header .brand{min-width:0}
header h1{font-size:clamp(18px,5.4vw,23px);line-height:1.15;letter-spacing:.1px}
header p{font-size:11.5px;opacity:.8;margin-top:5px;overflow-wrap:anywhere}
main{width:100%;max-width:720px;padding:17px 14px 24px}
h2{margin:22px 3px 10px;color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.1px}
.card{
  border-radius:18px;border-color:var(--line);
  box-shadow:0 5px 20px #102A430B;
}
#home .home-intro{
  padding:8px 2px 18px;
  animation:home-rise .46s ease both;
}
#home .home-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:1.7px;font-weight:800;
  text-transform:uppercase;color:var(--sea);
}
#home .home-kicker:before{content:"";width:7px;height:7px;background:#E53F41;border-radius:50%;box-shadow:0 0 0 4px #E53F4120}
#home .home-intro h2{
  margin:10px 0 8px;font-size:clamp(25px,7vw,37px);
  line-height:1.09;letter-spacing:-.9px;font-weight:900;color:var(--ink);
}
#home .home-intro h2 em{font-style:normal;color:var(--sea);display:block}
#home .home-intro p{margin:0;max-width:46ch;font-size:13.5px;line-height:1.5;color:var(--mute)}
#home .home-next{
  position:relative;isolation:isolate;overflow:hidden;
  padding:22px 20px 23px;border:0;border-radius:22px;
  background:linear-gradient(128deg,#061B39 0%,#104469 56%,#146F7F 100%);
  color:white;box-shadow:0 10px 29px #0C446538;
  animation:home-rise .52s .05s ease both;
}
#home .home-next:before{
  content:"";pointer-events:none;position:absolute;z-index:-1;inset:0;
  background:repeating-linear-gradient(90deg,#FFFFFF09 0 44px,transparent 44px 88px);
}
#home .home-next:after{
  content:"";position:absolute;pointer-events:none;z-index:-1;
  width:250px;height:250px;border:2px solid #FFFFFF23;border-radius:50%;
  right:-126px;top:-105px;box-shadow:0 0 0 48px #FFFFFF08,0 0 0 102px #FFFFFF06;
}
#home .home-next .tag{
  background:#F7C35D;color:#382A04;font-weight:800;
  padding:6px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;
}
#home .home-next .vs{
  max-width:100%;margin:19px 0 12px;
  font-size:clamp(20px,5.7vw,31px);line-height:1.26;
  letter-spacing:-.5px;font-weight:850;overflow-wrap:anywhere;
}
#home .home-next small{
  font-size:13px;line-height:1.5;opacity:.88;
}
#home .home-result{
  border-radius:19px;display:block;padding:17px 12px 15px;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
  animation:home-rise .5s .10s ease both;
}
#home .home-result .board{gap:6px;margin:3px 0 12px}
#home .home-result .tm{font-size:clamp(11px,3.2vw,14px);line-height:1.35}
#home .home-result .num{font-size:clamp(29px,8vw,42px);min-width:43px;padding:10px 7px;border-radius:12px}
#home .home-result .match-cue{
  display:flex;justify-content:center;align-items:center;gap:6px;
  font-weight:700;font-size:12px;margin-top:12px;
}
#home .home-result:active{transform:scale(.99)}
#home .home-standing .row{padding:8px 0}
#home .home-standing .sc{color:var(--sea);font-size:19px}
#home .home-standing .row b{font-size:16px}
#home .form{gap:9px}
#home .form .dot{width:38px;height:38px;border-radius:11px;box-shadow:0 3px 9px #092E3215}
nav{
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -4px 18px #0E2D4212;
}
nav button{min-height:52px;transition:background .2s ease,color .2s ease}
nav button.on{background:color-mix(in srgb,var(--sea) 10%,transparent)}
nav button i{font-size:21px}
@media(hover:hover){
  #home .home-result:hover{transform:translateY(-2px);box-shadow:0 9px 25px #0D3A5120;border-color:var(--sea)}
  nav button:hover{background:color-mix(in srgb,var(--sea) 7%,transparent)}
}
@keyframes home-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:360px){
  header{gap:10px;padding-inline:12px}
  header .crest{width:48px;height:48px;flex-basis:48px}
  header p{font-size:10.5px}
  main{padding-inline:10px}
  #home .home-next{padding:19px 15px}
  #home .home-result{padding-inline:8px}
  #home .home-result .board{gap:4px}
  nav button{font-size:11px;padding-inline:0}
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#091722;--card:#102534;--ink:#E9F3F9;--mute:#ABC0CD;
    --line:#284455;--sea:#64C6E1;--navy:#08243F;
  }
  :root:not([data-theme="light"]) body{background:radial-gradient(ellipse at 85% 0,#123148,transparent 70%),var(--bg)}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Standings table: fixed numeric columns, responsive team name. */
#table table {
  width: 100%;
  table-layout: fixed;
  font-size: clamp(12px, 1.2vw + 9px, 14px);
  font-variant-numeric: tabular-nums;
}
#table th, #table td {
  padding: 12px 6px;
  vertical-align: middle;
  line-height: 1.35;
  white-space: nowrap;
  overflow-wrap: normal;
}
#table th:first-child, #table td:first-child { width: 28px; text-align: center; }
#table th:nth-child(2), #table td:nth-child(2) {
  width: auto;
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
}
#table th:nth-child(3), #table td:nth-child(3) { width: 33px; text-align: center; }
#table th:nth-child(4), #table td:nth-child(4) { width: 69px; text-align: center; }
#table th:nth-child(5), #table td:nth-child(5) { width: 34px; text-align: center; }
@media (max-width: 360px) {
  #table th, #table td { padding: 10px 3px; }
  #table th:nth-child(4), #table td:nth-child(4) { width: 60px; }
}

/* Squad cards stay in the cached HTML shell; other sections keep their width. */
main:has(#squad.on){max-width:1200px}
#squad .stats-head{align-items:flex-end;margin:8px 2px 18px;gap:12px}
#squad .squad-kicker{display:block;color:var(--sea);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
#squad .stats-head h2{font-size:30px;line-height:1.1;margin:6px 0 0;letter-spacing:-.7px}
#squad .squad-summary{display:grid;gap:10px;margin-bottom:14px}
#squad .squad-summary .card{margin:0;padding:14px 16px;box-shadow:none}
#squad .squad-coach{border-left:3px solid var(--sun)}
#squad .squad-coach small{display:block;color:var(--mute);font-size:12px;margin-bottom:5px}
#squad .squad-leaders h2{margin:0 0 6px;font-size:13px}
#squad .stats-top{font-size:12px;margin:0;padding-left:18px}
#squad .stats-filters{gap:8px;padding:6px 2px 14px;margin:6px 0 2px}
#squad .stats-filters button{min-height:44px;padding:9px 14px;font-weight:600}
#squad .stats-filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--sea);color:#fff;box-shadow:inset 0 -2px var(--sun)}
#squad .stats-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#squad .stats-player{min-width:0;padding:0;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 16px #102A4308;transition:border-color .2s ease,box-shadow .2s ease}
#squad .squad-portrait{position:relative;aspect-ratio:1/1;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,var(--navy),#145B80);color:#fff;border-bottom:3px solid var(--sun)}
#squad .squad-portrait:before{content:"";position:absolute;z-index:-1;width:80%;aspect-ratio:1;border:1px solid #FFFFFF24;border-radius:50%;right:-30%;bottom:-30%;box-shadow:0 0 0 22px #FFFFFF08,0 0 0 44px #FFFFFF05}
#squad .squad-initials{font-size:clamp(32px,7vw,52px);font-weight:800;letter-spacing:2px;opacity:.8}
#squad .squad-portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
#squad .squad-card-body{display:flex;flex-direction:column;flex:1;min-width:0;padding:12px}
#squad .stats-name{font-size:15px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
#squad .stats-role{font-size:11px;margin:5px 0 12px;overflow-wrap:anywhere}
#squad .stats-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:auto}
#squad .stats-value{min-width:0;padding:8px;border-radius:10px}
#squad .stats-value b{font-size:22px;line-height:1.2}
#squad .stats-value small{font-size:11px}
#squad .squad-card-cue{display:flex;align-items:center;justify-content:space-between;color:var(--sea);font-size:11px;font-weight:700;margin-top:12px}
#squad .squad-card-cue span{font-size:16px;line-height:1}
#squad .stats-list>.empty{grid-column:1/-1}
@media(min-width:640px){
  #squad .stats-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  #squad .squad-summary{grid-template-columns:1fr 2fr}
  #squad .squad-card-body{padding:14px}
}
@media(min-width:1024px){#squad .stats-list{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1280px){#squad .stats-list{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(hover:hover){#squad .stats-player:hover{border-color:var(--sea);box-shadow:0 8px 24px #102A4318}}
@keyframes squad-appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:no-preference){
  #squad.on .stats-player{animation:squad-appear .32s ease backwards;animation-delay:var(--squad-delay,0ms)}
}
@media(prefers-reduced-motion:reduce){#squad .stats-player{animation:none;transition:none}}

</style>

<body>
<header><div class="crest" aria-hidden="true"><img src="icon-192.png?v=crest-v4" alt="" width="54" height="54"></div><div class="brand"><h1>ФК «Судак»</h1><p>Открытый чемпионат Крыма · 2026</p></div></header>
<main>
<section id="home" class="on" aria-label="Главная"></section>
<section id="matches" aria-label="Матчи"></section>
<section id="table" aria-label="Таблица"></section>
<section id="squad" aria-label="Состав"></section>
<section id="news" aria-label="Новости"></section>
<section id="match" aria-label="Подробности матча"></section>
<section id="player" aria-label="Профиль футболиста"></section>
<p class="note" id="upd" role="status">Загружаем актуальные данные…</p>

<script>

}

  const position=me>=0?`<h2>В таблице</h2><div class="card home-standing"><div class="row"><div class="l"><b>${me+1} место</b><small>${esc(mt[1])} игр, мячи ${esc(mt[2])}</small></div><div class="sc">${esc(mt[3])} очков</div></div>${me>0?`<div class="row"><div class="l"><b>До лидера</b><small>${esc(lead[0])}</small></div><div class="sc">${asNumber(lead[3])-asNumber(mt[3])} очк.</div></div>`:""}</div>`:"";
  $("home").innerHTML=`<div class="home-intro"><span class="home-kicker">ФК Судак · сезон 2026</span><h2>Наш клуб. <em>Наша игра.</em></h2><p>Следите за матчами, результатами и командой в одном месте.</p></div>`+nearest+latest+(form.length?`<h2>Форма: последние 5 игр</h2><div class="card"><div class="form">${form.map(f=>`<div class="dot ${f}">${lt[f]}</div>`).join("")}</div></div>`:"")+position;

  renderMatch();

}
const matchKey=r=>[2026,r[0],r[1],r[5]].join("|");
const matchHref=r=>"#match="+encodeURIComponent(matchKey(r))+"&from=home";
function protocolLink(raw){
  try{const u=new URL(String(raw||""),"https://rffk-roo.ru");return u.protocol==="https:"&&u.host==="rffk-roo.ru"&&/^\/matches\/\d+\/?$/.test(u.pathname)&&!u.search&&!u.hash?u.href:""}catch{return ""}
}
const PLAYER_ROLES=["all","Вратари","Защитники","Полузащитники","Нападающие"];
const normalizedName=value=>String(value||"").normalize("NFC").toLocaleLowerCase("ru").replace(/ё/g,"е").trim().replace(/\s+/g," ");
function officialPlayerURL(raw){
  try{const u=new URL(String(raw||""));return u.protocol==="https:"&&u.host==="rffk-roo.ru"&&/^\/players\/\d+\/$/.test(u.pathname)&&!u.search&&!u.hash?u.href:""}catch{return ""}
}
const playerKey=p=>officialPlayerURL(p.profile_url)?"rffk-"+new URL(p.profile_url).pathname.split("/")[2]:"name:"+normalizedName(p.name);
const profileHash=(key,name,role=PLAYER_ROLE)=>"#player="+encodeURIComponent(key)+"&name="+encodeURIComponent(name||"")+"&role="+encodeURIComponent(role);
const playerHref=p=>profileHash(playerKey(p),p.name);
function findPlayer(route,players=playerRows()){
  const exact=players.filter(p=>playerKey(p)===route.player);
  if(exact.length===1)return exact[0];
  // Old/partial statistics may temporarily omit the official profile URL.
  const sameName=players.filter(p=>normalizedName(p.name)===normalizedName(route.playerName));
  return !exact.length&&sameName.length===1&&!officialPlayerURL(sameName[0].profile_url)?sameName[0]:null;
}
function officialPhoto(p){
  if(!officialPlayerURL(p.profile_url)||p.photo_source_url!==p.profile_url)return "";
  try{
    const u=new URL(p.photo_url);
    return u.protocol==="https:"&&u.host==="rffk-roo.ru"&&!u.search&&!u.hash&&
      /^\/uploads\/people\/(?:large|medium|small)\/[a-z0-9_-]+\.(?:jpe?g|png|webp)$/i.test(u.pathname)&&
      !/(?:default|no[-_]?photo|placeholder|unknown|empty|avatar)\./i.test(u.pathname)?u.href:"";
  }catch{return ""}
}
function scorerMatchesName(author,name){
  const a=normalizedName(author),n=normalizedName(name);
  if(a===n)return true;
  // Exact surname + first initial, optionally with a patronymic initial.
  // Never use surname-only matching or edit-distance guesses.
  const hit=a.match(/^([\p{L}]+(?:-[\p{L}]+)*)\s+([\p{L}])\.(?:\s*([\p{L}])\.)?$/u);
  const parts=n.split(" ");
  return !!hit&&parts.length>=2&&hit[1]===parts[0]&&hit[2]===parts[1][0]&&
    (!hit[3]||(parts.length>=3&&hit[3]===parts[2][0]));
}
function resolveScorer(goal,players){
  // An own goal belongs to the match score, never to personal scoring totals.
  if(!goal||!["goal","penalty"].includes(goal.type))return null;
  const candidates=players.filter(p=>scorerMatchesName(goal.player,p.name));
  return candidates.length===1?candidates[0]:null;
}
function playerGoalMatches(player,players=playerRows(),results=RES,details=MATCH_DETAILS){
  const entries=[];let unavailable=0,ambiguous=0;
  for(const row of results){
    const d=details[matchKey(row)];
    const side=row[5]==="дома"?"home":"away";
    const scores=side==="home"?[row[2],row[3]]:[row[3],row[2]];
    const names=side==="home"?["ФК «Судак»",row[1]]:[row[1],"ФК «Судак»"];
    if(!d||d.status!=="available"||!Array.isArray(d.goals)||
       d.home!==names[0]||d.away!==names[1]||d.home_score!==scores[0]||d.away_score!==scores[1]||
       !/^2026-\d{2}-\d{2}$/.test(d.date||"")){
      unavailable++;continue;
    }
    for(const g of d.goals){
      if(g.side!==side||!["goal","penalty"].includes(g.type))continue;
      const scorer=resolveScorer(g,players);
      if(!scorer&&scorerMatchesName(g.player,player.name))ambiguous++;
      if(scorer&&playerKey(scorer)===playerKey(player))entries.push({row,goal:g,date:d.date});
    }
  }
  // RES is already ordered newest-first; keep the source order within a match.
  return {entries,unavailable,ambiguous};
}
function renderPlayer(){
  const route=currentRoute();if(route.section!=="player")return;

  if(!p){$("player").innerHTML=back+'<h2 id="player-title" tabindex="-1">Футболист недоступен</h2><div class="card empty">Профиль пока не найден в загруженном составе. Проверьте подключение или вернитесь к составу.</div>';return}
  document.title=p.name+" · ФК «Судак»";
  const initials=p.name.trim().split(/\s+/).slice(0,2).map(part=>part[0]).join("");
  const photo=officialPhoto(p),source=officialPlayerURL(p.profile_url);
  const avatar=`<div class="player-avatar"><span aria-hidden="true">${esc(initials)}</span>${photo?`<img src="${esc(photo)}" alt="${esc(p.name)}" referrerpolicy="no-referrer">`:""}</div>`;
  const values=[["league_games","Матчи"],["league_goals","Голы"],["league_minutes","Минуты"],["league_starts","В старте"],["league_substitutions","На замену"],["league_penalty_goals","С пенальти"]];
  const stats=values.map(([field,label])=>`<div class="stats-value" data-stat="${field}"><b>${statValue(p[field])}</b><small>${label}</small></div>`).join("");
  const {entries,unavailable,ambiguous}=playerGoalMatches(p);
  const total=Number.isInteger(p.league_goals)&&p.league_goals>=0?p.league_goals:null;
  const uncertain=unavailable||ambiguous||total===null||entries.length!==total;
  let coverage=entries.length?`По протоколам подтверждено голов: ${entries.length}.`:"Подтверждённые голы в доступных протоколах не найдены.";
  if(unavailable)coverage+=` Недоступны или неполны протоколы: ${unavailable}.`;
  if(ambiguous)coverage+=' Есть неоднозначные сокращённые имена: такие голы не приписаны футболисту.';
  if(uncertain)coverage+=' Список может быть неполным; итоговая статистика РФФК показана отдельно и не пересчитывается по протоколам.';
  const list=entries.length?entries.map(({row,goal,date},i)=>`<a class="row match-link player-goal" href="#match=${encodeURIComponent(matchKey(row))}&amp;from=player&amp;player=${encodeURIComponent(playerKey(p))}&amp;name=${encodeURIComponent(p.name)}&amp;role=${encodeURIComponent(PLAYER_ROLE)}" data-match="${esc(matchKey(row))}" data-goal="${i}"><div class="l"><b>${esc(row[1])}</b><small>${esc(date.split("-").reverse().join("."))} · ${esc(goal.minute)}′${goal.type==="penalty"?" · с пенальти":""}</small></div><div class="sc">${esc(row[5]==="дома"?row[2]:row[3])}:${esc(row[5]==="дома"?row[3]:row[2])} <span aria-hidden="true">›</span></div></a>`).join(""):
    `<p class="empty">${total===0&&!uncertain?"По статистике РФФК голов в чемпионате 2026 нет.":"Подтверждённые голы в доступных протоколах не найдены. Это не означает, что футболист не забивал."}</p>`;
  const stale=p.stats_current===false||PLAYER_STATS_2026?.verified===false;
  $("player").innerHTML=back+`<div class="card player-hero">${avatar}<div><h2 id="player-title" tabindex="-1">${esc(p.name)}</h2><p class="stats-role">${esc(p.position)}</p><span class="tag">Сезон 2026</span></div></div><h2>Открытый чемпионат Республики Крым · 2026</h2><div class="card"><div class="profile-values">${stats}</div><p class="hint">${stale?"Последние подтверждённые значения РФФК. ":""}Прочерк означает отсутствие подтверждённых данных. Голы с пенальти входят в общее число голов.</p></div><p class="hint">Всего игр в карточке РФФК: ${statValue(p.federation_games)} · общий показатель федерации, не показатель сезона 2026.</p>${source?`<p class="hint"><a class="stats-source" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Карточка футболиста на сайте РФФК ↗</a>${photo?" · Фото: РФФК":""}</p>`:""}<h2>Голы в матчах</h2><p class="hint" id="goal-coverage">${esc(coverage)}</p><div class="card player-goals">${list}</div><p class="hint">Итоговый счёт в списке: хозяева — гости. Автоголы не включены в личные голы футболиста.</p>`;
  const image=$("player").querySelector('.player-avatar img');
  if(image)image.addEventListener("error",()=>image.remove(),{once:true});
}
function renderMatch(){
  const route=currentRoute();if(route.section!=="match")return;
  const row=RES.find(r=>matchKey(r)===route.key);
  const back=`<button type="button" class="match-back" id="match-back">← ${route.origin==="player"?"К футболисту":route.origin==="home"?"На главную":"К матчам"}</button>`;
  if(!row){$("match").innerHTML=back+'<h2 tabindex="-1" id="match-title">Матч недоступен</h2><div class="card empty">Сведения об этом матче пока недоступны. Проверьте подключение или выберите матч в разделе «Матчи».</div>';return}

  const home=row[5]==="дома";
  const teams=home?["ФК «Судак»",row[1]]:[row[1],"ФК «Судак»"];
  const scores=home?[row[2],row[3]]:[row[3],row[2]];
  const validDate=/^2026-\d{2}-\d{2}$/.test(detail?.date||"")?detail.date.split("-").reverse().join("."):row[0]+" 2026";
  const source=protocolLink(detail?.source_url);
  const available=detail?.status==="available"&&Array.isArray(detail.goals);
  const types={penalty:" · с пенальти",own_goal:" · автогол"};
  const goals=available?detail.goals:[];
  const events=available?(goals.length?`<ol class="goal-timeline">${goals.map(g=>`<li><span class="goal-minute">${esc(g.minute)}′</span><div class="goal-player"><b>${esc(g.player)}</b><small>${esc(teams[g.side==="home"?0:1])}${esc(types[g.type]||"")}</small></div><b class="sc">${esc(g.score[0])}:${esc(g.score[1])}</b></li>`).join("")}</ol>`:'<p class="empty">В этом матче голов не было.</p>'):'<p class="empty" role="status">Протокол матча недоступен или содержит неполные данные. Авторы голов, минуты и хронология пока не подтверждены.</p>';
  $("match").innerHTML=back+`<h2 tabindex="-1" id="match-title">Подробности матча</h2><div class="card"><div class="board"><div class="tm">${esc(teams[0])}<small>Хозяева</small></div><div class="num ${home?"us":""}">${esc(scores[0])}</div><div class="num ${home?"":"us"}">${esc(scores[1])}</div><div class="tm">${esc(teams[1])}<small>Гости</small></div></div><p class="match-meta">${esc(validDate)}${detail?.time?" · "+esc(detail.time):""}<br>${esc(detail?.venue||row[4]||"Стадион не указан")}</p></div><h2>Хронология голов</h2><div class="card">${events}</div>${source?`<p class="hint"><a class="stats-source" href="${esc(source)}" target="_blank" rel="noopener noreferrer">Протокол на сайте РФФК ↗</a></p>`:""}<p class="hint">Счёт указан в порядке: хозяева — гости. Сведения из официального протокола РФФК.</p>`;
}
function currentRoute(){
  const hash=location.hash.slice(1),params=new URLSearchParams(hash);
  const role=PLAYER_ROLES.includes(params.get("role"))?params.get("role"):
    (PLAYER_ROLES.includes(history.state?.playerRole)?history.state.playerRole:PLAYER_ROLE);
  const player=params.get("player"),playerName=params.get("name")||"";
  if(hash.startsWith("player="))return {section:"player",player,playerName,role};
  if(hash.startsWith("match=")){
    const from=params.get("from");
    return {section:"match",key:params.get("match"),origin:from==="player"&&player?"player":from==="home"?"home":"matches",player,playerName,role};
  }
  const section=hash.split("&")[0];
  return {section:["home","matches","table","squad","news"].includes(section)?section:"home",role};
}
function routeParent(route){
  if(route.section==="player")return "#squad&role="+encodeURIComponent(route.role);
  if(route.origin==="player")return profileHash(route.player,route.playerName,route.role);
  return "#"+route.origin;
}
function applyRoute(restore=false){
  const route=currentRoute();
  if(PLAYER_ROLE!==route.role){PLAYER_ROLE=route.role;renderSquad()}
  document.querySelectorAll('main section').forEach(el=>el.classList.toggle("on",el.id===route.section));
  const tab=route.section==="player"||route.origin==="player"?"squad":route.section==="match"?route.origin:route.section;
  document.querySelectorAll('#nav button').forEach(el=>{
    const active=el.dataset.t===tab;
    el.classList.toggle("on",active);
    if(active)el.setAttribute("aria-current","page");else el.removeAttribute("aria-current");
  });
  if(route.section==="match")renderMatch();
  if(route.section==="player")renderPlayer();
  const title=route.section==="player"?findPlayer(route)?.name:route.section==="match"?"Матч":"";
  document.title=(title?title+" · ":"")+"ФК «Судак»";
  window.scrollTo(0,restore?(history.state?.scrollY||0):0);
  if(restore){
    const focus=history.state?.focusPlayer?{selector:"a[data-player]",field:"player",value:history.state.focusPlayer}:
      history.state?.focusMatch?{selector:"a[data-match]",field:"match",value:history.state.focusMatch}:null;
    const link=focus?[...$(route.section).querySelectorAll(focus.selector)].find(a=>a.dataset[focus.field]===focus.value&&(!history.state?.focusGoal||a.dataset.goal===history.state.focusGoal)):null;
    if(link){link.focus({preventScroll:true});return}
  }
  $(route.section+"-title")?.focus({preventScroll:true});
}
function rememberPosition(focusMatch,focusPlayer,focusGoal){
  history.replaceState({...history.state,scrollY:window.scrollY,playerRole:PLAYER_ROLE,focusMatch,focusPlayer,focusGoal},"",location.href);
}
for(const section of ["home","matches","player"])$(section).addEventListener("click",openMatch);
function plainClick(event){return event.button===0&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey}
function openMatch(event){

  event.preventDefault();
  const origin=currentRoute().section;
  rememberPosition(link.dataset.match,undefined,link.dataset.goal);
  history.pushState({matchEntry:true,parent:location.hash},"",origin==="player"?link.getAttribute("href"):"#match="+encodeURIComponent(link.dataset.match)+"&from="+origin);
  applyRoute();
}
$("squad").addEventListener("click",event=>{
  const link=event.target.closest("a[data-player]");
  if(!link||!plainClick(event))return;
  event.preventDefault();rememberPosition(undefined,link.dataset.player);
  history.pushState({playerEntry:true,parent:location.hash||"#squad"},"",link.getAttribute("href"));applyRoute();
});
function returnToParent(){
  const route=currentRoute();
  if((route.section==="match"&&history.state?.matchEntry)||(route.section==="player"&&history.state?.playerEntry))history.back();
  else{history.replaceState({},"",routeParent(route));applyRoute()}
}
$("match").addEventListener("click",event=>{if(event.target.closest("#match-back"))returnToParent()});
$("player").addEventListener("click",event=>{if(event.target.closest("#player-back"))returnToParent()});
window.addEventListener("popstate",()=>applyRoute(true));
window.addEventListener("hashchange",()=>applyRoute(true));
if("scrollRestoration" in history)history.scrollRestoration="manual";

// Отдельная статистика конкретного турнира: 2026, не смешиваем с общим числом игр.
function playerRows(){
  if(PLAYER_STATS_2026?.season===2026&&Array.isArray(PLAYER_STATS_2026.players)&&
     PLAYER_STATS_2026.players.length>0){
    return PLAYER_STATS_2026.players.filter(p=>p&&typeof p.name==="string"&&
      typeof p.position==="string"&&typeof p.federation_games==="number");
  }
  // Совместимость со старым data.json до первого нового запуска Actions.
  return Object.entries(SQUAD).flatMap(([position,members])=>
    (Array.isArray(members)?members:[]).map(row=>{
      const [name,count]=String(row).split("|");
      return {name,position,federation_games:Number(count)||0,
        league_games:null,league_goals:null,league_minutes:null,league_penalty_goals:null};
    }));
}
const statValue=value=>Number.isInteger(value)&&value>=0?esc(value):"—";
function renderSquad(){
  const players=playerRows();
  const roles=["Вратари","Защитники","Полузащитники","Нападающие"];
  const verified=players.filter(p=>Number.isInteger(p.league_goals)&&p.league_goals>=0);
  const best=[...verified].sort((a,b)=>b.league_goals-a.league_goals||a.name.localeCompare(b.name,"ru")).slice(0,3);
  const listing=players.filter(p=>PLAYER_ROLE==="all"||p.position===PLAYER_ROLE)
    .sort((a,b)=>{
      const ga=Number.isInteger(a.league_goals)?a.league_goals:-1;
      const gb=Number.isInteger(b.league_goals)?b.league_goals:-1;
      return gb-ga||a.name.localeCompare(b.name,"ru");
    });
  const source="https://rffk-roo.ru/tournaments/4/";
  const labels=[["all","Все"],...roles.map(role=>[role,role])];
  const leader=best.length?`<div class="card squad-leaders"><h2>Бомбардиры · 2026</h2><ol class="stats-top">${best.map(p=>`<li><b>${esc(p.name)}</b> — ${esc(p.league_goals)} гол.</li>`).join("")}</ol></div>`:"";
  const stale=PLAYER_STATS_2026?.verified===false&&verified.length>0;
  const statDate=Date.parse(PLAYER_STATS_2026?.stats_as_of||"");
  const asOf=Number.isFinite(statDate)?" ("+new Date(statDate).toLocaleDateString("ru-RU")+")":"";
  const caution=verified.length
    ?(stale?"Статистика чемпионата из последнего подтверждённого обновления"+asOf+": сейчас источник временно недоступен.":"Статистика чемпионата подтверждена турнирной таблицей РФФК"+asOf+".")
    :"Подтверждённая статистика чемпионата пока недоступна: прочерк означает отсутствие данных, а не ноль.";
  const head=`<div class="stats-head"><div><span class="squad-kicker">Наша команда · 2026</span><h2>Состав</h2></div><a class="stats-source" href="${source}" target="_blank" rel="noopener noreferrer">Источник: РФФК ↗</a></div>`;
  const coach=COACH?`<div class="card squad-coach"><small>Главный тренер</small><b>${esc(COACH)}</b></div>`:"";
  const filters=`<div class="stats-filters" role="group" aria-label="Фильтр по позиции">${labels.map(([val,label])=>`<button type="button" data-role="${esc(val)}" aria-pressed="${PLAYER_ROLE===val}">${esc(label)}${val==="all"?" ("+players.length+")":""}</button>`).join("")}</div>`;
  const cards=listing.map((p,index)=>{
    const photo=officialPhoto(p);
    const initials=p.name.trim().split(/\s+/).slice(0,2).map(part=>part[0]).join("");
    const portrait=`<div class="squad-portrait" aria-hidden="true"><span class="squad-initials">${esc(initials)}</span>${photo?`<img src="${esc(photo)}" alt="" loading="lazy" decoding="async" width="320" height="320" referrerpolicy="no-referrer">`:""}</div>`;
    return `<a class="stats-player player-link" href="${esc(playerHref(p))}" data-player="${esc(playerKey(p))}" aria-label="Профиль футболиста: ${esc(p.name)}" style="--squad-delay:${Math.min(index,5)*35}ms">${portrait}<div class="squad-card-body"><div class="stats-name">${esc(p.name)}</div><div class="stats-role">${esc(p.position)}</div><div class="stats-values"><div class="stats-value" data-stat="league_games"><b>${statValue(p.league_games)}</b><small>Матчи · 2026</small></div><div class="stats-value" data-stat="league_goals"><b>${statValue(p.league_goals)}</b><small>Голы · 2026</small></div></div><span class="squad-card-cue">Профиль <span aria-hidden="true">↗</span></span></div></a>`;
  }).join("");
  $("squad").innerHTML=head+`<div class="squad-summary">${coach}${leader}</div>`+`<p class="hint">${esc(caution)}</p>`+filters+
    `<div class="stats-list">${cards||'<div class="card empty">Игроки не найдены.</div>'}</div>`+
    `<p class="hint">Матчи и голы — только Открытый чемпионат РК 2026. Прочерк означает, что значение не подтверждено. Подробная статистика — в профиле. Фото — из подтверждённых карточек РФФК; если снимка нет, показаны инициалы.</p>`;
}
// Image errors do not bubble; capture also handles lazy portraits after filtering.
$("squad").addEventListener("error",event=>{
  if(event.target.matches(".squad-portrait img"))event.target.remove();
},true);
$("squad").addEventListener("click",event=>{
  const btn=event.target.closest("button[data-role]");if(!btn)return;
  if(!["all","Вратари","Защитники","Полузащитники","Нападающие"].includes(btn.dataset.role))return;
  PLAYER_ROLE=btn.dataset.role;
  history.replaceState({...history.state,playerRole:PLAYER_ROLE},"","#squad&role="+encodeURIComponent(PLAYER_ROLE));renderSquad();
});

$("nav").addEventListener("click",event=>{
  const b=event.target.closest("button[data-t]");if(!b)return;
  rememberPosition();
  history.pushState({},"","#"+b.dataset.t+(b.dataset.t==="squad"?"&role="+encodeURIComponent(PLAYER_ROLE):""));applyRoute();
});
// Данные федерации обновляются в GitHub каждый час. Открытая вкладка
// проверяет опубликованный data.json каждые пять минут, а также при
// возвращении на вкладку и восстановлении подключения к интернету.
// Перерисовываем карточки только при появлении новой версии данных.
const DATA_POLL_MS=5*60*1000;
const DATA_MIN_GAP_MS=15*1000;
let lastAttemptAt=0;
let lastDataTimestamp=-Infinity;
let lastDataLabel="";
let hasNetworkData=false;
let hasSavedData=false;
const DATA_STORAGE_KEY="sudak-data-v1";
let loadingData=false;

function dataLabel(timestamp){
  return "Данные обновлены: "+new Date(timestamp).toLocaleString("ru-RU",{
    day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

function validData(d){
  return d&&Array.isArray(d.table)&&d.table.length>=5&&
    d.table.some(row=>Array.isArray(row)&&String(row[0]).includes("Судак"))&&
    Array.isArray(d.res)&&Array.isArray(d.next)&&Array.isArray(d.news)&&
    d.squad&&typeof d.squad==="object"&&!Array.isArray(d.squad)&&Number.isFinite(Date.parse(d.updated));
}
function adoptData(d){
  TABLE=d.table;RES=d.res;NEXT=d.next;SQUAD=d.squad;
  NEWS=d.news;COACH=typeof d.coach==="string"?d.coach:COACH;
  PLAYER_STATS_2026=d.player_stats_2026||null;
  MATCH_DETAILS=d.match_details&&typeof d.match_details==="object"&&!Array.isArray(d.match_details)?d.match_details:{};
}
function restoreSavedData(){
  try{
    const d=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY));
    if(!validData(d))return;
    adoptData(d);lastDataTimestamp=Date.parse(d.updated);
    lastDataLabel=dataLabel(lastDataTimestamp);hasSavedData=true;
    $("upd").textContent=lastDataLabel+" · Сохранённые данные; проверяем обновления…";
  }catch{/* Storage may be disabled or full; network loading still works. */}
}

async function refreshData(force=false){
  if(loadingData||(!force&&Date.now()-lastAttemptAt<DATA_MIN_GAP_MS))return;
  lastAttemptAt=Date.now();
  loadingData=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    // Уникальный параметр запрещает промежуточным кэшам возвращать старую
    // версию; service worker исключает data.json из своего кэширования.
    const url=new URL("data.json",document.baseURI);
    url.searchParams.set("v",String(Date.now()));
    const response=await fetch(url.href,{
      cache:"no-store",signal:controller.signal,headers:{Accept:"application/json"}
    });
    if(!response.ok)throw Error("HTTP "+response.status);
    const d=await response.json();
    if(!validData(d))throw Error("Неожиданный формат данных");
    const stamp=Date.parse(d.updated);
    // Защита от запаздывающего ответа CDN: не откатываемся к старой версии.
    if(stamp>=lastDataTimestamp){
      if(!hasNetworkData||stamp>lastDataTimestamp){
        adoptData(d);
        render();
      }
      lastDataTimestamp=stamp;
      lastDataLabel=dataLabel(stamp);
      try{localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify(d));hasSavedData=true}catch{}
    }
    hasNetworkData=true;
    $("upd").textContent=lastDataLabel;
  }catch(error){
    // При отсутствии сети не очищаем уже показанный календарь и результаты.
    $("upd").textContent=hasNetworkData||hasSavedData
      ?lastDataLabel+" · Нет связи, показаны последние полученные данные"
      :"Нет свежих данных: показана резервная информация. Проверьте интернет.";
  }finally{
    clearTimeout(timeout);
    loadingData=false;
  }
}

restoreSavedData();
render();
applyRoute(true);
refreshData();
setInterval(()=>{if(!document.hidden)refreshData()},DATA_POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshData()});
window.addEventListener("focus",()=>refreshData());
window.addEventListener("online",()=>refreshData(true));
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    // Проверяем наличие новой версии приложения при открытии и далее раз в час.
    reg.update().catch(()=>{});
    setInterval(()=>{if(!document.hidden)reg.update().catch(()=>{})},60*60*1000);
  }).catch(()=>{});
}

</script>
