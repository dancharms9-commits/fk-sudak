<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#0F2C45;--mute:#5E7486;--line:#D9E3E8;--sea:#1B7A8C;--navy:#0F2C45;--sun:#E3A93B;--win:#1E8E5A;--loss:#C0453A;--onnavy:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1822;--card:#122734;--ink:#E6EEF2;--mute:#8FA6B5;--line:#1E3A4B;--sea:#4FB3C4;--navy:#0D2233;--win:#4CC38A;--loss:#E07A6E;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--navy);color:var(--onnavy);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;display:flex;gap:14px;align-items:center}
.crest{width:52px;height:52px;border-radius:50%;background:var(--sea);display:grid;place-items:center;font-weight:800;font-size:26px;border:3px solid var(--sun);flex:none}
header h1{margin:0;font-size:22px;letter-spacing:.2px}header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{padding:14px;max-width:640px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font-size:15px;margin:22px 2px 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.next{background:var(--navy);color:var(--onnavy);border:0}
.next .vs{font-size:24px;font-weight:800;margin:6px 0 2px;overflow-wrap:anywhere}
.next small{opacity:.82;display:block;margin-top:3px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sun);color:#3a2800;font-weight:600}
.board{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px}
.num{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;line-height:1;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;min-width:58px;text-align:center}.num.us{background:var(--sea)}
.tm{flex:1;text-align:center;font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.form{display:flex;gap:6px}.dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}.W{background:var(--win)}.D{background:var(--mute)}.L{background:var(--loss)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .l{min-width:0;flex:1}.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:13px;margin-top:3px}.sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:500;text-align:right;padding:6px 4px}td{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}th:nth-child(2),td:nth-child(2){text-align:left;width:100%;overflow-wrap:anywhere}tr.me td{background:color-mix(in srgb,var(--sun) 22%,transparent);font-weight:700}
.g{display:grid;grid-template-columns:1fr auto;gap:0 12px}.pl{display:contents}.pl span{padding:9px 0;border-top:1px solid var(--line)}.pl span:last-child{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.news a{display:block;color:inherit;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--line)}.news a:last-child{border:0}.news a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}.news small{display:block;color:var(--mute);margin-top:4px}.news .source{font-size:12px;color:var(--sea)}
/* Раздел статистики: отдельные карточки, видимые значения и фильтры. */
.stats-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin:10px 2px}
.stats-head strong{font-size:17px}.stats-source{font-size:12px;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.stats-filters{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 10px;scrollbar-width:thin}
.stats-filters button{font:inherit;font-size:13px;white-space:nowrap;padding:8px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.stats-filters button[aria-pressed="true"]{background:var(--sea);color:#fff;border-color:var(--sea);font-weight:700}
.stats-filters button:focus-visible,.player-link:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stats-list{display:grid;gap:9px}.stats-player{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats-name{font-size:15px;font-weight:700}.stats-role{font-size:12px;color:var(--mute);margin-top:2px}
.stats-values{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.stats-value{min-width:74px;flex:1;border-radius:9px;background:var(--bg);padding:7px 10px}
.stats-value b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.stats-value small{color:var(--mute);font-size:11px}
.stats-minor{font-size:12px;color:var(--mute);margin:9px 0 0}
.stats-top{font-size:13px;line-height:1.7;margin:6px 0 0;padding-left:22px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px;min-width:0}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--sea);font-weight:700}nav button:focus-visible{outline:2px solid var(--sea)}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 8px 0}.empty{color:var(--mute);font-size:14px}.hint{color:var(--mute);font-size:12px;line-height:1.45;margin:10px 2px}.venue{color:var(--mute)}
/* Match links retain the existing cards, colours and mobile spacing. */
a.match-link{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.match-link:focus-visible,.match-back:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
a.match-link:hover{background:var(--bg)}
.match-cue{display:block;color:var(--sea);font-size:12px;text-align:center;margin-top:9px}
.match-back{font:inherit;background:var(--card);color:var(--sea);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:9px 14px;cursor:pointer}
.match-meta{text-align:center;color:var(--mute);font-size:14px;line-height:1.7;margin:0}
#match .tm small{display:block;font-size:11px;font-weight:400;color:var(--mute);margin-top:4px}
.goal-timeline{list-style:none;padding:0;margin:0}
.goal-timeline li{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.goal-timeline li:last-child{border:0}
.goal-minute{color:var(--sea);font-weight:700;min-width:46px;font-variant-numeric:tabular-nums}
.goal-player{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.goal-player small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
@media(max-width:360px){#match .board{gap:6px}#match .num{font-size:36px;min-width:44px;padding:9px 8px}}
a.player-link{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.player-link:hover{border-color:var(--sea)}
.player-hero{display:flex;align-items:center;gap:16px;margin-top:16px}
.player-hero>div:last-child{min-width:0}.player-hero h2{color:var(--ink);font-size:22px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.player-hero .stats-role{margin:7px 0 10px;font-size:14px}
.player-avatar{position:relative;display:grid;place-items:center;width:88px;height:104px;flex:none;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,var(--navy),var(--sea));border:2px solid var(--sun);color:#fff;font-size:28px;font-weight:800}
.player-avatar img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}
.profile-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.profile-values .stats-value{min-width:0;margin:0;padding:10px 8px}
.player-goals a.player-goal{display:flex}
@media(max-width:360px){.player-avatar{width:70px;height:88px}.player-hero{gap:12px}.player-hero h2{font-size:20px}}

/* Modern Football Home 2026 — shared source, embedded for the offline shell. */
:root{--bg:#EDF2F5;--card:#FFFFFF;--ink:#102A43;--mute:#52697A;--line:#D8E2E9;--sea:#147186;--navy:#001329;--sun:#C8A457}
html{scroll-behavior:auto}
body{background:var(--bg);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:relative;display:flex;align-items:center;gap:12px;min-height:80px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;background:#001329;border-bottom:2px solid var(--sun)}
header .crest{width:54px;height:54px;flex:0 0 54px;border:1px solid #FFFFFF30;border-radius:12px;overflow:hidden;background:#001329}
header .crest img{width:100%;height:100%;object-fit:contain;display:block}
header .brand{min-width:0}
header h1{font-size:clamp(18px,5.4vw,23px);line-height:1.15;letter-spacing:.1px}
header p{font-size:12px;opacity:.85;margin-top:5px;overflow-wrap:anywhere}
main{width:100%;max-width:720px;padding:17px 14px 24px}
h2{margin:22px 3px 10px;color:var(--ink);font-size:16px;font-weight:750}
.card{border-radius:14px;border-color:var(--line);box-shadow:none}
#home .home-intro{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:3px 2px 16px}
#home .home-kicker{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.5px}
#home .home-intro h2{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.5px}
#home .home-next,#match .home-next{display:block;background:#001329;color:#fff;padding:20px;border:1px solid #C8A45766;border-radius:16px;text-decoration:none}
.home-match-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-match-top .tag{background:#C8A457;color:#001329;padding:4px 10px;font-size:12px;font-weight:750}
.home-season{font-size:12px;color:#C7D3DF;font-variant-numeric:tabular-nums}
.home-competition{margin:14px 0 0;font-size:12px;color:#C7D3DF;line-height:1.5}
.home-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;margin:22px 0;font-size:clamp(18px,4.8vw,26px);font-weight:750;line-height:1.25}
.home-teams>span{overflow-wrap:anywhere;min-width:0}
.home-teams>span:last-child{text-align:right}
.home-score{font-size:clamp(22px,6vw,34px);white-space:nowrap;color:#E0C186;font-variant-numeric:tabular-nums}
.home-match-meta{display:grid;gap:5px;font-size:13px;line-height:1.5;color:#C7D3DF}
.home-match-meta b{font-size:15px;color:#fff;font-weight:650}
.home-detail{display:flex;justify-content:space-between;border-top:1px solid #FFFFFF25;padding-top:13px;margin-top:17px;font-size:14px;font-weight:650;color:#E0C186}
#home .home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px;align-items:start}
#home .home-block{min-width:0;display:block}
#home .home-block h2{margin:20px 0 10px;font-size:16px}
.home-block-head{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;gap:0 12px}
.home-block-head>a{font-size:13px;color:var(--sea);text-decoration:none;padding:10px 0;min-height:44px}
#home .home-result{padding:16px;display:block}
.home-result-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.home-result-top small{font-size:13px;color:var(--mute)}
.home-outcome{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px}
.home-outcome.W{color:var(--win);background:color-mix(in srgb,var(--win) 10%,transparent)}
.home-outcome.D{color:var(--mute);background:var(--bg)}

.home-result-score{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:13px;font-size:15px;font-weight:650}
.home-result-score>span{min-width:0;overflow-wrap:anywhere}
.home-result-score b{font-size:30px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.home-opponent{font-weight:400;color:var(--mute)}
#home .match-cue{font-size:13px;text-align:left;margin-top:14px}
.home-standing-top{display:flex;gap:18px;align-items:center;padding:2px 0 16px;border-bottom:1px solid var(--line)}
.home-standing-top>b{display:flex;align-items:baseline;gap:7px;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}

.home-standing-top>span{font-size:12px;line-height:1.5;color:var(--mute)}
.home-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0;gap:8px}
.home-metrics dt{color:var(--mute);font-size:12px}
.home-metrics dd{margin:3px 0 0;font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.home-form{border-top:1px solid var(--line);padding-top:12px}
.home-form>span{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
#home .form{gap:7px}
#home .form .dot{width:30px;height:30px;border-radius:6px;font-size:13px}
.home-leader{border-bottom:1px solid var(--line);padding:12px 0}
.home-leader:first-child{padding-top:0}.home-leader:last-of-type{border:0;padding-bottom:0}
.home-leader-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
#home h3{font-size:14px;line-height:1.4;margin:0;font-weight:650;overflow-wrap:anywhere}
.home-leader-heading>b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.home-leader-heading small{font-size:12px;color:var(--mute);font-weight:400}
#home .home-player{display:flex;gap:10px;align-items:center;min-height:52px;padding:6px 0;font-size:14px;border-radius:6px}
.home-player>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.home-player>span:last-child{color:var(--mute)}
.home-avatar{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px;font-weight:650;color:var(--mute)}
.home-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#home .home-news .card{padding:0 16px}
#home .home-news a{padding:15px 0;overflow-wrap:anywhere}
#home .home-news h3{margin:6px 0 8px;font-size:15px}
#home .home-news small{margin:0;font-size:12px}
#home .home-news p{font-size:13px;color:var(--mute);margin:6px 0 10px}
#home a.card,#home .home-player{transition:background-color 180ms ease,border-color 180ms ease,transform 180ms ease}
#home a.card:active,#home .home-player:active{transform:scale(.99)}
#home a:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
#home .home-next:focus-visible{outline-color:var(--sun)}
nav{background:var(--card);box-shadow:0 -2px 12px #00132908}
nav button{min-height:52px;transition:background .18s ease,color .18s ease}
nav button.on{background:color-mix(in srgb,var(--sea) 8%,transparent)}
nav button i{font-size:21px}
@media(hover:hover){#home a.card:hover,#home .home-player:hover{border-color:var(--sea);background:var(--bg)}#home .home-next:hover{background:#0B2541;border-color:var(--sun)}.home-block-head>a:hover{text-decoration:underline}}
@media(min-width:768px){main:has(#home.on){max-width:1040px}#home .home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#home .home-teams{font-size:28px;margin:25px 0}#home .home-next{padding:24px}#home .home-intro h2{font-size:26px}}
@media(max-width:360px){header{gap:10px;padding-inline:12px}header .crest{width:48px;height:48px;flex-basis:48px}header p{font-size:11px}main{padding-inline:10px}#home .home-next{padding:16px}.home-teams{gap:9px}.home-block-head{gap:0 8px}.home-standing-top{gap:12px}nav button{font-size:11px;padding-inline:0}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#091722;--card:#102534;--ink:#E9F3F9;--mute:#ABC0CD;--line:#284455;--sea:#74C7DC;--navy:#001329}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Standings table: fixed numeric columns, responsive team name. */
#table table {
  width: 100%;
  table-layout: fixed;
  font-size: clamp(12px, 1.2vw + 9px, 14px);
  font-variant-numeric: tabular-nums;
}
#table th, #table td {
  padding: 12px 6px;
  vertical-align: middle;
  line-height: 1.35;
  white-space: nowrap;
  overflow-wrap: normal;
}
#table th:first-child, #table td:first-child { width: 28px; text-align: center; }
#table th:nth-child(2), #table td:nth-child(2) {
  width: auto;
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
}
#table th:nth-child(3), #table td:nth-child(3) { width: 33px; text-align: center; }
#table th:nth-child(4), #table td:nth-child(4) { width: 69px; text-align: center; }
#table th:nth-child(5), #table td:nth-child(5) { width: 34px; text-align: center; }
@media (max-width: 360px) {
  #table th, #table td { padding: 10px 3px; }
  #table th:nth-child(4), #table td:nth-child(4) { width: 60px; }
}

<div id="launch-splash" role="status" aria-label="ФК Судак. Запуск приложения" aria-busy="true" hidden>
  <img class="launch-crest" src="assets/club-crest-final-original.png" alt="" width="1086" height="1448" fetchpriority="high" decoding="async">
  <p class="launch-name" aria-hidden="true">ФК СУДАК</p>
</div>
<div id="launch-error" role="alert" hidden>
  <p>Не удалось завершить запуск. Можно продолжить с доступной информацией или повторить загрузку.</p>
  <button type="button" id="launch-continue">Продолжить</button>
  <button type="button" id="launch-retry">Повторить загрузку</button>
</div>
<script data-launch-splash>
// One controller per document: hash routes, data refresh and focus never restart it.
(()=>{
  const splash=document.getElementById('launch-splash');
  const image=splash.querySelector('img');
  const warning=document.getElementById('launch-error');
  const timers=[];
  const locked=[];
  let finished=false,appReady=false,crestReady=false,started=false;
  let previousFocus=null;
  splash.hidden=false;
  function finish(failed=false){
    if(finished)return;
    finished=true;
    timers.forEach(clearTimeout);
    locked.forEach(([element,inert])=>{element.inert=inert});
    splash.remove();
    document.getElementById('launch-canvas')?.remove();
    warning.hidden=!failed;
    window.removeEventListener('error',onError);
    window.removeEventListener('unhandledrejection',onError);
    window.removeEventListener('sudak:ready',onReady);
    if(previousFocus?.isConnected&&!failed)previousFocus.focus({preventScroll:true});
  }
  function start(){
    if(started||finished||!appReady||!crestReady)return;
    started=true;
    // Count the brand interval only once the actual approved PNG is visible.
    timers.push(setTimeout(()=>splash.classList.add('is-leaving'),3000));
    timers.push(setTimeout(()=>finish(),3500));
  }
  function onReady(){
    if(finished||appReady)return;
    appReady=true;
    previousFocus=document.activeElement===document.body?null:document.activeElement;
    document.querySelectorAll('body > header,body > main,body > nav').forEach(element=>{
      locked.push([element,element.inert]);element.inert=true;
    });
    start();
  }
  function onError(){finish(true)}
  window.addEventListener('sudak:ready',onReady);
  window.addEventListener('error',onError);
  window.addEventListener('unhandledrejection',onError);
  image.addEventListener('load',()=>{
    crestReady=true;splash.classList.add('crest-ready');start();
  },{once:true});
  image.addEventListener('error',onError,{once:true});
  if(image.complete){
    if(image.naturalWidth){crestReady=true;splash.classList.add('crest-ready')}
    else onError();
  }
  // A broken script, unavailable image or stalled startup must never trap users.
  timers.push(setTimeout(()=>finish(true),8000));
  document.getElementById('launch-continue').addEventListener('click',()=>{warning.hidden=true});
  document.getElementById('launch-retry').addEventListener('click',()=>location.reload());
})();
</script>

let TABLE=[["СК «Каштан»",16,"90–21",48],["ФК «Судак»",16,"63–30",40],["«СТО-Газель»",15,"68–30",33],["ФК «Фуна»",15,"54–42",24],["ФК «НКСТРОЙ-Керчь»",15,"36–45",17],["ФК «Саки»",15,"34–55",15],["АФК",15,"29–45",14],["ФК «Сталкер»",16,"39–83",14],["ФК «Турбо»",16,"30–64",13],["«Темп»",15,"29–59",12],["УОР",6,"20–18",6]];

let NEXT=[["14 ноября","УОР","","в гостях"],["22 ноября","ФК «Сталкер»","","в гостях"],["28 ноября","СК «Каштан»","","дома"]];

const asNumber=value=>Number.isFinite(Number(value))?Number(value):0;

  const hit=String(value||'').trim().toLowerCase().match(/^(\d{1,2})\s+([а-я]+)(?:\s+(\d{4}))?$/);
  if(!hit)return null;
  const month=HOME_MONTHS.indexOf(hit[2]),year=Number(hit[3]||HOME_SEASON),day=Number(hit[1]);
  const date=new Date(Date.UTC(year,month,day));
  return month>=0&&year===HOME_SEASON&&date.getUTCMonth()===month&&date.getUTCDate()===day?date.getTime():null;
}
function homeMatches(upcoming=NEXT,results=RES,now=Date.now()){
  // Даты календаря без времени сравниваем по дню в часовом поясе клуба.
  const clubDay=new Date(now+3*60*60*1000).toISOString().slice(0,10);

    .sort((a,b)=>b.date-a.date).map(m=>m.row);
  return {next,latest:completed[0]||null,completed};

  const index=table.findIndex(t=>Array.isArray(t)&&normalizedName(t[0]).replace(/[«»"']/g,'')==='фк судак');

  const metric=n=>Number.isInteger(n)&&n>=0?n:null;
  return {place:index+1,games:metric(row[1]),points:metric(row[3]),difference:goals?Number(goals[1])-Number(goals[2]):null};

function homeLeaders(players=playerRows()){
  return [['league_goals','Бомбардиры','гол.'],['league_games','Больше матчей','матч.'],['league_minutes','Больше минут','мин.']].map(([field,label,unit])=>{

    return {field,label,unit,value,partial:known.length<players.length,
      players:value>0?known.filter(p=>p[field]===value).sort((a,b)=>a.name.localeCompare(b.name,'ru')):[]};

    .sort((a,b)=>(b.date??-Infinity)-(a.date??-Infinity)||a.index-b.index).slice(0,3).map(n=>n.row);
}
const homeOutcome=r=>({W:'Победа',D:'Ничья',L:'Поражение'})[kind(r)];

  const row=result||(planned?upcomingMatchRow(planned):null);
  if(!row)return null;
  const home=row[5]==='дома',finished=!!result&&[row[2],row[3]].every(n=>Number.isInteger(n)&&n>=0);

    competition:typeof detail?.competition==='string'&&detail.competition?detail.competition:'Открытый чемпионат Республики Крым',round:typeof detail?.round==='string'?detail.round:'',source:protocolLink(detail?.source_url)};

function matchPlayer(name,side,model,players=playerRows(),sourceURL=''){

  if(sourceURL){
    const matches=players.filter(p=>officialPlayerURL(p.profile_url)===sourceURL&&normalizedName(p.name)===normalizedName(name));
    return matches.length===1?matches[0]:null;
  }
  if(entries.length){
    const identities=entries.filter(p=>scorerMatchesName(name,p.name));
    if(identities.length!==1)return null;
    if(identities[0].profile_url)return matchPlayer(identities[0].name,side,model,players,identities[0].profile_url);
    const exact=players.filter(p=>normalizedName(p.name)===normalizedName(identities[0].name));

function matchParentHash(value){

function matchParentTab(hash,depth=0){

  if(params.get('profileFrom')==='home')return 'home';

function currentRoute(){

    (PLAYER_ROLES.includes(history.state?.playerRole)?history.state.playerRole:PLAYER_ROLE);
  const player=params.get("player"),playerName=params.get("name")||"";
  if(hash.startsWith("player="))return {section:"player",player,playerName,role,origin:params.get("from")==="home"?"home":params.get("from")==="match"?"match":"squad",matchParent:matchParentHash(params.get("back"))};

function routeParent(route){

  if(route.origin==="player")return profileHash(route.player,route.playerName,route.role)+(route.profileOrigin==="home"?"&from=home":route.profileOrigin==="match"?"&from=match&back="+encodeURIComponent(route.profileBack):"");

  event.preventDefault();rememberPosition();history.pushState({},"",link.getAttribute('href'));applyRoute();
});
$("nav").addEventListener("click",event=>{
  const b=event.target.closest("button[data-t]");if(!b)return;
  rememberPosition();
  history.pushState({},"","#"+b.dataset.t+(b.dataset.t==="squad"?"&role="+encodeURIComponent(PLAYER_ROLE):""));applyRoute();
});
// Данные федерации обновляются в GitHub каждый час. Открытая вкладка
// проверяет опубликованный data.json каждые пять минут, а также при
// возвращении на вкладку и восстановлении подключения к интернету.
// Перерисовываем карточки только при появлении новой версии данных.
const DATA_POLL_MS=5*60*1000;
const DATA_MIN_GAP_MS=15*1000;
let lastAttemptAt=0;
let lastDataTimestamp=-Infinity;
let lastDataLabel="";
let hasNetworkData=false;
let hasSavedData=false;
const DATA_STORAGE_KEY="sudak-data-v1";
let loadingData=false;

function dataLabel(timestamp){
  return "Данные обновлены: "+new Date(timestamp).toLocaleString("ru-RU",{
    day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"
  });
}

function validData(d){
  return d&&Array.isArray(d.table)&&d.table.length>=5&&
    d.table.some(row=>Array.isArray(row)&&String(row[0]).includes("Судак"))&&
    Array.isArray(d.res)&&Array.isArray(d.next)&&Array.isArray(d.news)&&
    d.squad&&typeof d.squad==="object"&&!Array.isArray(d.squad)&&Number.isFinite(Date.parse(d.updated));
}
function adoptData(d){
  TABLE=d.table;RES=d.res;NEXT=d.next;SQUAD=d.squad;
  NEWS=d.news;COACH=typeof d.coach==="string"?d.coach:COACH;
  PLAYER_STATS_2026=d.player_stats_2026||null;
  MATCH_DETAILS=d.match_details&&typeof d.match_details==="object"&&!Array.isArray(d.match_details)?d.match_details:{};
}
function restoreSavedData(){
  try{
    const d=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY));
    if(!validData(d))return;
    adoptData(d);lastDataTimestamp=Date.parse(d.updated);
    lastDataLabel=dataLabel(lastDataTimestamp);hasSavedData=true;
    $("upd").textContent=lastDataLabel+" · Сохранённые данные; проверяем обновления…";
  }catch{/* Storage may be disabled or full; network loading still works. */}
}

async function refreshData(force=false){
  if(loadingData||(!force&&Date.now()-lastAttemptAt<DATA_MIN_GAP_MS))return;
  lastAttemptAt=Date.now();
  loadingData=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    // Уникальный параметр запрещает промежуточным кэшам возвращать старую
    // версию; service worker исключает data.json из своего кэширования.
    const url=new URL("data.json",document.baseURI);
    url.searchParams.set("v",String(Date.now()));
    const response=await fetch(url.href,{
      cache:"no-store",signal:controller.signal,headers:{Accept:"application/json"}
    });
    if(!response.ok)throw Error("HTTP "+response.status);
    const d=await response.json();
    if(!validData(d))throw Error("Неожиданный формат данных");
    const stamp=Date.parse(d.updated);
    // Защита от запаздывающего ответа CDN: не откатываемся к старой версии.
    if(stamp>=lastDataTimestamp){
      if(!hasNetworkData||stamp>lastDataTimestamp){
        adoptData(d);
        render();
      }
      lastDataTimestamp=stamp;
      lastDataLabel=dataLabel(stamp);
      try{localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify(d));hasSavedData=true}catch{}
    }
    hasNetworkData=true;
    $("upd").textContent=lastDataLabel;
    $("retry-data").hidden=true;
  }catch(error){
    // При отсутствии сети не очищаем уже показанный календарь и результаты.
    $("upd").textContent=hasNetworkData||hasSavedData
      ?lastDataLabel+" · Нет связи, показаны последние полученные данные"
      :"Нет свежих данных: показана резервная информация. Проверьте интернет.";
    $("retry-data").hidden=false;
  }finally{
    clearTimeout(timeout);
    loadingData=false;
  }
}

restoreSavedData();
render();
applyRoute(true);
window.dispatchEvent(new Event("sudak:ready"));
// Появление главной после заставки; сам контроллер и его 3500 мс не меняются.
if($('launch-splash')){
  const homeObserver=new MutationObserver(()=>{if(!$('launch-splash')){homeObserver.disconnect();revealHome()}});
  homeObserver.observe(document.body,{childList:true});
}
refreshData();
$("retry-data").addEventListener("click",()=>refreshData(true));
setInterval(()=>{if(!document.hidden)refreshData()},DATA_POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshData()});
window.addEventListener("focus",()=>refreshData());
window.addEventListener("online",()=>refreshData(true));
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    // Проверяем наличие новой версии приложения при открытии и далее раз в час.
    reg.update().catch(()=>{});
    setInterval(()=>{if(!document.hidden)reg.update().catch(()=>{})},60*60*1000);
  }).catch(()=>{});
}

</script>
</body>
</html>
